name: Pages

on:
  push:
    branches: [main]
    paths:
      - ndx100-scanner.html
      - chartpacks/**
      - LATEST.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site/chartpacks
          cp ndx100-scanner.html _site/index.html
          cp LATEST.md _site/ 2>/dev/null || true
          cp chartpacks/* _site/chartpacks/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
