name: Scan

on:
  workflow_dispatch:
    inputs:
      scan:
        description: 掃描最新日線（關閉 = 只更新網站）
        type: boolean
        default: true
      index:
        description: Universe
        type: choice
        options:
          - both
          - ndx100
          - dji30
        default: both
      date:
        description: As-of date YYYY-MM-DD (empty = UTC today)
        required: false
        default: ""
  schedule:
    - cron: "30 10 * * 1-5"
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]
    paths:
      - ndx100-scanner.html
      - chartpacks/**
      - LATEST.md
      - .github/workflows/scan.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan-pages
  cancel-in-progress: false

jobs:
  site:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scan != 'false')
        with:
          python-version: "3.12"
      - name: Run scanner
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scan != 'false')
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          INDEX="${{ github.event.inputs.index }}"
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$INDEX" ]; then INDEX=both; fi
          python scan.py --index "$INDEX" --date "$DATE" --sleep 0.3
      - name: Commit results
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.scan != 'false')
        run: |
          git add chartpacks LATEST.md
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update scan chartpacks"
          git push
      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site/chartpacks
          cp ndx100-scanner.html _site/index.html
          cp LATEST.md _site/ 2>/dev/null || true
          cp chartpacks/* _site/chartpacks/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Upload chartpacks artifact
        uses: actions/upload-artifact@v4
        with:
          name: chartpacks
          path: chartpacks/*.json
          if-no-files-found: warn
          retention-days: 30
