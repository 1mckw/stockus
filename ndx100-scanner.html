syncFilterChips();
function applyLineMode(pop) {
  if (state.view === "single" && state.selected) {
    syncFilterChips(pop);
    renderList({ animate: true });
    const row = state.results.find(r => r.symbol === state.selected);
    if (row) showSingle(row);
    return;
  }
  applyFilters(pop);
}
function setSkipLast(n, apply) {
  const max = CFG.skipLastBarsMax || 20;
  n = Math.max(0, Math.min(max, n | 0));
  state.ignoreLastBars = n;
  if (state.selected) {
    if (n > 0) state.casePick[state.selected] = n;
    else state.casePick[state.selected] = -1;
  }
  if (!apply) {
    syncFilterChips({ popKey: "skip" });
    return;
  }
  if (state.filterSkip) applyLineMode({ popKey: "skip" });
  else {
    syncFilterChips({ popKey: "skip" });
    renderList({ animate: true });
    if (state.view === "pack" && state.results.some(r => r.bars)) renderPack();
    else if (state.view === "single" && state.selected) {
      const row = state.results.find(r => r.symbol === state.selected);
      if (row) showSingle(row);
    }
  }
}
function placeSkipCal() {
  const panel = $("skipLastPanel");
  const btn = $("filterSkipToggle");
  if (!panel || !btn) return;
  const r = btn.getBoundingClientRect();
  const w = panel.offsetWidth || 232;
  const h = panel.offsetHeight || 280;
  let left = r.left;
  if (left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - w - 8);
  if (left < 8) left = 8;
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 8 - h);
  panel.style.left = `${left}px`;
  panel.style.top = `${top}px`;
}

function setSkipPickerOpen(on) {
  const wrap = $("skipCalWrap");
  if (wrap) wrap.classList.toggle("is-open", !!on);
  const panel = $("skipLastPanel");
  if (on) {
    placeSkipCal();
    requestAnimationFrame(placeSkipCal);
  } else if (panel) {
    panel.style.left = "";
    panel.style.top = "";
  }
  syncFilterChips();
}
function selectSkipLast(n) {
  setSkipLast(state.ignoreLastBars === n ? 0 : n, true);
  setSkipPickerOpen(false);
}
function buildSkipButtons() {
  const box = $("skipLastBtns");
  if (!box) return;
  box.innerHTML = "";
  const max = CFG.skipLastBarsMax || 20;
  for (let n = 1; n <= max; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.skip = String(n);
    b.textContent = String(n);
    b.title = `找線與畫線不使用最新 ${n} 根（再點一次取消）`;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => selectSkipLast(n);
    box.appendChild(b);
  }
}
buildSkipButtons();
$("filterSkipToggle").onclick = (e) => {
  e.stopPropagation();
  const wrap = $("skipCalWrap");
  setSkipPickerOpen(!wrap?.classList.contains("is-open"));
};
document.addEventListener("click", (e) => {
  const wrap = $("skipCalWrap");
  if (!wrap?.classList.contains("is-open")) return;
  if (wrap.contains(e.target)) return;
  setSkipPickerOpen(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setSkipPickerOpen(false);
});
$("filterSkipAlso").onclick = (e) => {
  e.stopPropagation();
  state.filterSkip = !state.filterSkip;
  applyFilters({ popKey: "filterSkip" });
  if (state.view === "single" && state.selected) {
    const row = state.results.find(r => r.symbol === state.selected);
    if (row) showSingle(row);
  }
};
$("filterNegSlope").onclick = () => {
  state.allowNegSlope = !state.allowNegSlope;
  applyLineMode({ popKey: "negSlope" });
};

/** 視窗尺寸變動時重繪（canvas 依實際寬度計算，避免字被縮小） */
let __resizeTimer = 0;
function onViewportResize() {
  clearTimeout(__resizeTimer);
  __resizeTimer = window.setTimeout(() => {
    if ($("skipCalWrap")?.classList.contains("is-open")) placeSkipCal();
    if (state.view === "pack") {
      renderPack();
      return;
    }
    if (state.view === "single") redrawMainChart();
  }, 160);
}
window.addEventListener("resize", onViewportResize);
window.visualViewport?.addEventListener("resize", onViewportResize);

(function bindMainChartNav() {
  const canvas = $("mainCanvas");
  if (!canvas) return;
  const pts = new Map();
  let pan = null;
  let pinch = null;

  function row() {
    return state.results.find(r => r.symbol === state.selected);
  }

  function zoomAt(clientX, factor) {
    const r = row();
    if (!r?.bars) return;
    const meta = canvas._chartMeta;
    const v = state.chartView || defaultChartView(r.bars);
    const rect = canvas.getBoundingClientRect();
    let frac = 0.5;
    if (meta && meta.pw > 0) {
      frac = (clientX - rect.left - meta.left) / meta.pw;
      frac = Math.max(0, Math.min(1, frac));
    }
    const anchor = (v.end - v.win) + frac * v.win;
    const win = v.win * factor;
    const start = anchor - frac * win;
    state.chartY = null;
    applyChartView(r.bars, { win, end: start + win });
    redrawMainChart(r);
  }

  canvas.addEventListener("wheel", (e) => {
    if (state.view !== "single") return;
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.14 : 1 / 1.14;
    zoomAt(e.clientX, factor);
  }, { passive: false });

  canvas.addEventListener("pointerdown", (e) => {
    if (state.view !== "single" || e.button !== 0) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = row();
    const v = state.chartView || (r?.bars ? defaultChartView(r.bars) : null);
    const meta = canvas._chartMeta;
    const wrap = canvas.closest(".chart-wrap");
    if (pts.size === 1 && v) {
      pan = {
        x: e.clientX,
        y: e.clientY,
        x0: e.clientX,
        y0: e.clientY,
        end: v.end,
        lo: meta?.lo,
        hi: meta?.hi,
        armed: false
      };
      pinch = null;
      wrap?.classList.add("is-panning");
    } else if (pts.size === 2 && v) {
      const [a, b] = [...pts.values()];
      pinch = {
        dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        win: v.win,
        end: v.end,
        midX: (a.x + b.x) / 2
      };
      pan = null;
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = row();
    if (!r?.bars) return;
    const meta = canvas._chartMeta;
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const win = pinch.win * (pinch.dist / dist);
      const meta2 = canvas._chartMeta;
      let frac = 0.5;
      if (meta2 && meta2.pw > 0) {
        const rect = canvas.getBoundingClientRect();
        frac = (pinch.midX - rect.left - meta2.left) / meta2.pw;
        frac = Math.max(0, Math.min(1, frac));
      }
      const anchor = (pinch.end - pinch.win) + frac * pinch.win;
      state.chartY = null;
      applyChartView(r.bars, { win, end: anchor - frac * win + win });
      redrawMainChart(r);
      return;
    }
    if (!pan || !meta || meta.n < 1) return;
    if (!pan.armed) {
      if (Math.hypot(e.clientX - pan.x0, e.clientY - pan.y0) < 5) return;
      pan.armed = true;
    }
    const v = state.chartView || defaultChartView(r.bars);
    const barW = meta.pw / meta.n;
    if (barW > 0) {
      applyChartView(r.bars, { win: v.win, end: pan.end + (pan.x - e.clientX) / barW });
    }
    if (meta.ph > 0 && pan.hi > pan.lo) {
      const dP = ((e.clientY - pan.y) / meta.ph) * (pan.hi - pan.lo);
      state.chartY = { lo: pan.lo + dP, hi: pan.hi + dP };
    }
    redrawMainChart(r);
  });

  function endPtr(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) {
      pan = null;
      canvas.closest(".chart-wrap")?.classList.remove("is-panning");
    } else if (pts.size === 1) {
      const r = row();
      const v = state.chartView;
      const p = [...pts.values()][0];
      const meta = canvas._chartMeta;
      if (r?.bars && v) {
        pan = {
          x: p.x,
          y: p.y,
          x0: p.x,
          y0: p.y,
          end: v.end,
          lo: meta?.lo,
          hi: meta?.hi,
          armed: true
        };
      }
    }
  }
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);

  canvas.addEventListener("dblclick", (e) => {
    if (state.view !== "single") return;
    e.preventDefault();
    const r = row();
    if (!r?.bars) return;
    state.chartView = defaultChartView(r.bars);
    state.chartY = null;
    redrawMainChart(r);
  });
})();

refreshSavedPacks().then((dates) => {
  if (ON_PAGES && dates[0]) openPack(dates[0]);
});
