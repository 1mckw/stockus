<script>
/* ========== 成分股 fallback ========== */
const NDX100_FALLBACK = [
  "AAPL","ABNB","ADBE","ADI","ADP","ADSK","AEP","ALAB","ALNY","AMAT","AMD","AMGN","AMZN","APP",
  "ARM","ASML","AVGO","AXON","BKR","BKNG","CCEP","CDNS","CEG","CMCSA","COST","CPRT","CRWD","CRWV",
  "CSCO","CSX","CTAS","DASH","DDOG","DXCM","EXC","FANG","FAST","FER","FTNT","GEHC","GILD","GOOG",
  "GOOGL","HON","HONA","IDXX","INTC","INTU","ISRG","KDP","KLAC","LIN","LITE","LRCX","MAR","MCHP",
  "MDLZ","MELI","META","MNST","MPWR","MRNA","MRVL","MSFT","MSTR","MU","NBIS","NFLX","NVDA","NXPI",
  "ODFL","ORLY","PANW","PAYX","PCAR","PDD","PEP","PLTR","PYPL","QCOM","REGN","RKLB","ROP","ROST",
  "SBUX","SHOP","SNDK","SNPS","STX","TER","TMUS","TRI","TSLA","TTWO","TXN","VRTX","WDAY","WDC",
  "WMT","XEL"
];

/** 道瓊 30（2025-11 · NVDA 取代 INTC、AMZN 取代 WBA） */
const DJI30_FALLBACK = [
  "AAPL","AMGN","AMZN","AXP","BA","CAT","CRM","CSCO","CVX","DIS",
  "DOW","GS","HD","HON","IBM","JNJ","JPM","KO","MCD","MMM",
  "MRK","MSFT","NKE","NVDA","PG","TRV","UNH","V","VZ","WMT"
];

/** Crypto 市值前 30（不含穩定幣；Yahoo -USD） */
const CRYPTO30_FALLBACK = [
  "BTC-USD","ETH-USD","BNB-USD","XRP-USD","SOL-USD",
  "TRX-USD","HYPE32196-USD","ZEC-USD","DOGE-USD","XMR-USD",
  "LINK-USD","LEO-USD","ADA-USD","XLM-USD","NEAR-USD",
  "BCH-USD","UNI7083-USD","LTC-USD","AVAX-USD","SUI20947-USD",
  "TON-USD","HBAR-USD","SHIB-USD","TAO22974-USD","CRO-USD",
  "ENA-USD","QNT-USD","OKB-USD","AAVE-USD","PEPE24478-USD"
];

const INDEXES = {
  ndx100: {
    label: "NDX100",
    fallback: NDX100_FALLBACK,
    apiPath: "/api/ndx100",
    minRows: 50
  },
  dji30: {
    label: "DJI30",
    fallback: DJI30_FALLBACK,
    apiPath: "/api/dji30",
    minRows: 25
  },
  crypto30: {
    label: "CRYPTO30",
    fallback: CRYPTO30_FALLBACK,
    apiPath: "/api/crypto30",
    minRows: 20
  }
};

function displaySymbol(sym) {
  return String(sym || "").replace(/-USD$/i, "").replace(/\d+$/, "");
}

const CFG = {
  pivotLeft: 3,
  pivotRight: 3,
  touchTolPct: 0.0045,       // 0.45% of price
  touchMergeBars: 5,         // 相鄰 ≤5 根內的觸點合併為 1
  maxTouchGapBars: 120,      // 相鄰觸點間隔不得超過 120 根 K
  recentTouchBars: 60,       // 至少一觸點須落在最新 60 根內（常開）
  maxBodyBreaks: 3,          // 成形後實體穿越最多 3 根
  maxWickBreaks: 5,          // 成形後引線穿越最多 5 根
  horizSlopePct: 0.015,      // |m|*bars / midPrice < 1.5% → near horizontal
  minTouches: 4,
  windows: [200, 300, 400, 500, 600, 800, 1000], // 做線視窗（由小到大）
  skipLastBarsMax: 20,
  chartWindow: 600, // 圖表固定顯示根數
  chartRightPadBars: 20, // 單圖視窗右緣預留空白（根）
  packRightPadBars: 40, // Chartpack 最新 K 右側空白（根）
  colors: {
    bg: "#0e0f12",
    grid: "#20232a",
    text: "#a2a6ae",
    textStrong: "#f4f5f7",
    up: "#4faf8d",
    down: "#e5647c",
    tlUp: "#4faf8d",
    tlDown: "#e5647c",
    creek: "#d9a441",
    ice: "#8ab4d9",
    wick: "#8b909a",
    accent: "#6ba6e8"
  }
};

/* ========== State ========== */
const INDEX_CHIP_IDS = [
  ["filterIndexAll", "all"],
  ["filterIndexNdx", "ndx100"],
  ["filterIndexDji", "dji30"],
  ["filterIndexCrypto", "crypto30"]
];

const state = {
  index: "all",
  symbols: [...NDX100_FALLBACK],
  results: [],
  cache: {},          // symbol → 完整日線（未截斷）
  selected: null,
  stop: false,
  packDate: "",
  view: "single",
  filters: { breakout: false, reclaim: false, touch: false, past: false },
  ignoreLastBars: 0,
  casePick: {},
  filterSkip: false,
  allowNegSlope: false,
  chartSymbol: null,
  chartView: null
};

function currentIndexConfig() {
  if (state.index === "all") return { label: "ALL" };
  return INDEXES[state.index] || INDEXES.ndx100;
}

function setIndexChipsDisabled(on) {
  for (const [id] of INDEX_CHIP_IDS) {
    const el = $(id);
    if (el) el.disabled = !!on;
  }
}

function syncIndexUi() {
  const cfg = currentIndexConfig();
  document.title = `${cfg.label} 日線掃描器 · 趨勢線 / Creek / Ice`;
  for (const [id, key] of INDEX_CHIP_IDS) {
    const el = $(id);
    if (!el) continue;
    const on = state.index === key;
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
  }
}

function selectIndex(v) {
  if ((v !== "all" && !INDEXES[v]) || v === state.index) return;
  state.index = v;
  syncIndexUi();
  refreshSavedPacks(state.packDate).then((dates) => {
    if (ON_PAGES) {
      const d = state.packDate || $("packDate").value || dates[0];
      if (d) openPack(d);
      return;
    }
    if (state.results.some(r => r.bars)) {
      applyFilters();
      const n = filteredResults().filter(r => r.bars).length;
      setStatusText(`顯示 ${currentIndexConfig().label} · ${n} 檔`);
      return;
    }
    setStatusText(`已選 ${currentIndexConfig().label} — 掃描會跑全部指數`);
  });
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/** 截斷至選定日期當日收盤（含） */
function barsAsOf(bars, dateStr) {
  if (!dateStr || !bars?.length) return bars || [];
  const end = new Date(dateStr + "T23:59:59").getTime();
  return bars.filter(b => b.t <= end);
}

/* ========== Data fetch (prefer local server.py proxy) ========== */
const ON_PAGES = /\.github\.io$/i.test(location.hostname);
if (ON_PAGES) {
  document.documentElement.classList.add("is-pages");
  document.body.classList.add("is-pages");
}
const LOCAL_BASE = (() => {
  const { hostname } = location;
  if (hostname === "127.0.0.1" || hostname === "localhost") return "";
  if (ON_PAGES) return "";
  return "http://127.0.0.1:8765";
})();

function packAsset(file) {
  const path = location.pathname.endsWith("/")
    ? location.pathname
    : location.pathname.replace(/[^/]*$/, "");
  return `${location.origin}${path}chartpacks/${encodeURIComponent(file)}`;
}

function medianGapDays(bars) {
  if (!bars || bars.length < 3) return Infinity;
  const gaps = [];
  for (let i = 1; i < bars.length; i++) {
    gaps.push((bars[i].t - bars[i - 1].t) / 86400000);
  }
  gaps.sort((a, b) => a - b);
  return gaps[Math.floor(gaps.length / 2)];
}

/** Yahoo range=max 常降採樣成週/月/季；只接受近似日線 */
function isDailyBars(bars, metaGran) {
  if (metaGran && metaGran !== "1d") return false;
  return medianGapDays(bars) <= 5;
}

function parseYahooBars(json) {
  const r = json?.chart?.result?.[0];
  if (!r) throw new Error("no result");
  const gran = r.meta?.dataGranularity;
  const ts = r.timestamp || [];
  const q = r.indicators?.quote?.[0] || {};
  const bars = [];
  for (let i = 0; i < ts.length; i++) {
    const o = q.open?.[i], h = q.high?.[i], l = q.low?.[i], c = q.close?.[i];
    const v = q.volume?.[i];
    if ([o, h, l, c].some(x => x == null || Number.isNaN(x))) continue;
    bars.push({
      t: ts[i] * 1000,
      o: +o, h: +h, l: +l, c: +c,
      v: v == null ? 0 : +v
    });
  }
  if (bars.length < 50) throw new Error("too few bars");
  if (!isDailyBars(bars, gran)) {
    throw new Error(`非日線資料（gran=${gran || "?"} gap≈${medianGapDays(bars).toFixed(1)}d）`);
  }
  return bars;
}

async function fetchIndexSymbols(indexKey = state.index) {
  const cfg = INDEXES[indexKey] || INDEXES.ndx100;
  const urls =
    indexKey === "ndx100"
      ? [
          `${LOCAL_BASE}${cfg.apiPath}`,
          "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://api.nasdaq.com/api/quote/list-type/nasdaq100"),
          "https://corsproxy.io/?" + encodeURIComponent("https://api.nasdaq.com/api/quote/list-type/nasdaq100")
        ]
      : [`${LOCAL_BASE}${cfg.apiPath}`];

  for (const url of urls) {
    try {
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok) continue;
      const json = await res.json();
      if (indexKey === "dji30" || indexKey === "crypto30") {
        const syms = json?.symbols;
        if (Array.isArray(syms) && syms.length >= cfg.minRows) {
          const mapped = syms.map(s => String(s).toUpperCase()).filter(Boolean);
          return indexKey === "crypto30" ? mapped : mapped.sort();
        }
        continue;
      }
      const rows = json?.data?.data?.rows;
      if (Array.isArray(rows) && rows.length >= cfg.minRows) {
        return rows.map(r => r.symbol).filter(Boolean).sort();
      }
    } catch (_) { /* try next */ }
  }
  return [...cfg.fallback];
}

async function fetchAllUniverseSymbols() {
  const membership = new Map();
  for (const key of Object.keys(INDEXES)) {
    let syms;
    try {
      syms = await fetchIndexSymbols(key);
    } catch (_) {
      syms = [...INDEXES[key].fallback];
    }
    for (const s of syms) {
      if (!membership.has(s)) membership.set(s, []);
      if (!membership.get(s).includes(key)) membership.get(s).push(key);
    }
  }
  return membership;
}

async function fetchDailyBars(symbol) {
  // 勿用 range=max：Yahoo 會改成週/月/季線。10y/5y 可維持 interval=1d。
  const ranges = ["10y", "5y"];
  let lastErr = null;
  for (const range of ranges) {
    const urls = [
      `${LOCAL_BASE}/api/chart?symbol=${encodeURIComponent(symbol)}&range=${range}`,
      "https://corsproxy.io/?" + encodeURIComponent(
        `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=${range}&includePrePost=false`
      )
    ];
    for (const url of urls) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (json?.error) throw new Error(json.error);
        return parseYahooBars(json);
      } catch (e) {
        lastErr = e;
      }
    }
  }
  throw lastErr || new Error("fetch failed");
}

/* ========== Pivots ========== */
function findPivots(bars, left, right) {
  const highs = [];
  const lows = [];
  const n = bars.length;
  for (let i = left; i < n - right; i++) {
    let isH = true, isL = true;
    for (let j = i - left; j <= i + right; j++) {
      if (j === i) continue;
      if (bars[j].h >= bars[i].h) isH = false;
      if (bars[j].l <= bars[i].l) isL = false;
    }
    if (isH) highs.push(i);
    if (isL) lows.push(i);
  }
  return { highs, lows };
}

function lineThrough(i1, p1, i2, p2) {
  const m = (p2 - p1) / (i2 - i1);
  const b = p1 - m * i1;
  return { m, b };
}
function yAt(line, i) { return line.m * i + line.b; }

function bodyTop(bar) { return Math.max(bar.o, bar.c); }
function bodyBot(bar) { return Math.min(bar.o, bar.c); }

function lineTol(lp) {
  return Math.max(Math.abs(lp) * CFG.touchTolPct, 1e-9);
}

function isTouchBar(bar, lp, resistance) {
  const wick = resistance ? bar.h : bar.l;
  return Math.abs(wick - lp) <= lineTol(lp);
}

function bodyFullCross(bar, lp, resistance) {
  return resistance ? bodyBot(bar) > lp : bodyTop(bar) < lp;
}

function wickOnlyCross(bar, lp, resistance) {
  if (bodyFullCross(bar, lp, resistance)) return false;
  return resistance
    ? bar.h > lp && bodyTop(bar) <= lp
    : bar.l < lp && bodyBot(bar) >= lp;
}

/** 整根實體在持有側：支撐實體完全在線上、壓力實體完全在線下 */
function bodyFullyHeld(bar, lp, resistance) {
  return resistance ? bodyTop(bar) < lp : bodyBot(bar) > lp;
}

function mergeTouchIndices(indices) {
  if (!indices.length) return [];
  const clusters = [[indices[0]]];
  for (let k = 1; k < indices.length; k++) {
    const i = indices[k];
    if (i - clusters[clusters.length - 1][clusters[clusters.length - 1].length - 1] <= CFG.touchMergeBars) {
      clusters[clusters.length - 1].push(i);
    } else {
      clusters.push([i]);
    }
  }
  return clusters.map(cl => cl[0]);
}

function touchSegments(indices) {
  const merged = mergeTouchIndices(indices);
  if (!merged.length) return [];
  const segs = [[merged[0]]];
  for (let k = 1; k < merged.length; k++) {
    const i = merged[k];
    const last = segs[segs.length - 1];
    if (i - last[last.length - 1] > CFG.maxTouchGapBars) segs.push([i]);
    else last.push(i);
  }
  return segs;
}

function betterSeg(a, b) {
  if (a.length !== b.length) return a.length > b.length;
  return (a[a.length - 1] - a[0]) > (b[b.length - 1] - b[0]);
}

function chooseTouchSegment(indices, minTouches, recentLo) {
  const segs = touchSegments(indices);
  if (!segs.length) return { seg: [], fail: "touches", touches: 0 };
  const pick = list => list.reduce((b, s) => (betterSeg(s, b) ? s : b));
  const enough = segs.filter(s => s.length >= minTouches);
  if (!enough.length) {
    const best = pick(segs);
    return { seg: best, fail: "touches", touches: best.length };
  }
  if (recentLo != null) {
    const recent = enough.filter(s => s.some(i => i >= recentLo));
    if (recent.length) return { seg: pick(recent) };
    const best = pick(enough);
    return { seg: best, fail: "recent", touches: best.length };
  }
  return { seg: pick(enough) };
}

function collectRawTouches(bars, line, resistance, startI, endI) {
  const hits = [];
  for (let i = startI; i <= endI; i++) {
    if (isTouchBar(bars[i], yAt(line, i), resistance)) hits.push(i);
  }
  return hits;
}

function pierceCounts(bars, line, resistance, startI, endI) {
  let bodyN = 0, wickN = 0;
  for (let i = startI; i <= endI; i++) {
    const lp = yAt(line, i);
    const bar = bars[i];
    if (bodyFullCross(bar, lp, resistance)) bodyN++;
    else if (wickOnlyCross(bar, lp, resistance)) wickN++;
  }
  return { bodyBreaks: bodyN, wickBreaks: wickN };
}

function lineScore(L) {
  return [L.touches.length, L._span || 0, -L.touches[0]];
}

function betterLine(a, b) {
  const sa = lineScore(a), sb = lineScore(b);
  for (let i = 0; i < sa.length; i++) {
    if (sa[i] !== sb[i]) return sa[i] > sb[i];
  }
  return false;
}

function packLine(bars, line, kind, touches, bodyN, wickN, lookback, horizontal) {
  const n = bars.length;
  const firstI = touches[0];
  const lastTouch = touches[touches.length - 1];
  const span = lastTouch - firstI;
  let type, label;
  if (horizontal) {
    type = kind === "support" ? "creek" : "ice";
    label = kind === "support" ? "Creek" : "Ice";
  } else {
    type = kind === "support" ? "uptrend" : "downtrend";
    label = kind === "support" ? "向上趨勢線" : "向下趨勢線";
  }
  return {
    kind,
    line,
    touches,
    bodyBreaks: bodyN,
    wickBreaks: wickN,
    start: Math.max(0, n - lookback),
    drawFrom: firstI,
    drawTo: n - 1,
    windowSize: lookback,
    score: touches.length * 10 + span * 0.01,
    _span: span,
    label,
    type
  };
}

function emptyMiss() {
  return { rank: -1, tried: 0, maxTouches: 0, fail: null, bodyN: 0, wickN: 0, touches: 0 };
}

function noteMiss(miss, ev) {
  miss.tried++;
  const t = ev.touches || 0;
  if (t > miss.maxTouches) miss.maxTouches = t;
  const rank = t * 10 + (ev.fail === "breaks" ? 3 : ev.fail === "recent" ? 2 : 1);
  if (rank < miss.rank) return;
  miss.rank = rank;
  miss.fail = ev.fail;
  miss.bodyN = ev.bodyN || 0;
  miss.wickN = ev.wickN || 0;
  miss.touches = t;
}

function mergeMiss(into, from) {
  if (!from || from.tried <= 0) return into;
  if (from.rank > into.rank) {
    return { ...from };
  }
  if (from.maxTouches > into.maxTouches) into.maxTouches = from.maxTouches;
  into.tried += from.tried;
  return into;
}

function formatWhy(kind, miss, noWindow) {
  const side = kind === "resistance" ? "壓力" : "支撐";
  if (noWindow) return `${side}不成線：做線資料不足（少於 80 根）`;
  if (!miss || miss.tried <= 0) return `${side}不成線：沒有可用樞軸錨點`;
  if (miss.fail === "breaks") {
    const bits = [];
    if (miss.bodyN > CFG.maxBodyBreaks) bits.push(`實體穿越 ${miss.bodyN}（最多 ${CFG.maxBodyBreaks}）`);
    if (miss.wickN > CFG.maxWickBreaks) bits.push(`引線穿越 ${miss.wickN}（最多 ${CFG.maxWickBreaks}）`);
    return `${side}不成線：${bits.join("、") || "穿越過多"}`;
  }
  if (miss.fail === "recent") return `${side}不成線：最新 ${recentTouchN()} 根沒有觸點`;
  if ((miss.maxTouches || 0) < CFG.minTouches) {
    return `${side}不成線：觸點不足（最長 ${miss.maxTouches} 點，需 ≥${CFG.minTouches}）`;
  }
  return `${side}不成線：未通過四點成線規則`;
}

function recentTouchN() {
  return CFG.recentTouchBars || 60;
}

function evaluateCandidate(bars, line, kind, winLo, lookback, opts = {}) {
  const minTouches = opts.minTouches || CFG.minTouches;
  const recentN = recentTouchN();
  const requireRecent = opts.requireRecent !== false && recentN > 0;
  const n = bars.length;
  const lastI = n - 1;
  const resistance = kind === "resistance";
  const raw = collectRawTouches(bars, line, resistance, winLo, lastI);
  const recentLo = requireRecent ? lastI - (recentN - 1) : null;
  const picked = chooseTouchSegment(raw, minTouches, recentLo);
  if (picked.fail) return { fail: picked.fail, touches: picked.touches };
  const seg = picked.seg;
  const firstI = seg[0];
  const br = pierceCounts(bars, line, resistance, firstI + 1, lastI);
  if (br.bodyBreaks > CFG.maxBodyBreaks || br.wickBreaks > CFG.maxWickBreaks) {
    return { fail: "breaks", touches: seg.length, bodyN: br.bodyBreaks, wickN: br.wickBreaks };
  }
  let outLine = { ...line };
  let horizontal = false;
  const span = seg[seg.length - 1] - firstI;
  const p0 = yAt(line, firstI);
  const maxWin = CFG.windows[CFG.windows.length - 1];
  if (lookback >= maxWin && p0) {
    const drift = Math.abs(line.m) * span / Math.abs(p0);
    if (drift < CFG.horizSlopePct) {
      const level = seg.reduce((s, i) => s + yAt(line, i), 0) / seg.length;
      outLine = { m: 0, b: level };
      horizontal = true;
    }
  }
  return { line: packLine(bars, outLine, kind, seg, br.bodyBreaks, br.wickBreaks, lookback, horizontal) };
}

function pivotsInLookback(bars, lookback) {
  const startIdx = Math.max(0, bars.length - lookback);
  const slice = bars.slice(startIdx);
  const { highs, lows } = findPivots(slice, CFG.pivotLeft, CFG.pivotRight);
  return {
    highs: highs.map(i => i + startIdx),
    lows: lows.map(i => i + startIdx)
  };
}

function collectSideLine(bars, lookback, kind, opts = {}) {
  const n = bars.length;
  const actual = Math.min(lookback, n);
  const winLo = n - actual;
  const { highs, lows } = pivotsInLookback(bars, actual);
  const pts = kind === "support" ? lows : highs;
  let best = null;
  const miss = emptyMiss();
  for (let a = 0; a < pts.length; a++) {
    for (let c = a + 1; c < pts.length; c++) {
      const i1 = pts[a], i2 = pts[c];
      if (i2 - i1 < 5) continue;
      const p1 = kind === "support" ? bars[i1].l : bars[i1].h;
      const p2 = kind === "support" ? bars[i2].l : bars[i2].h;
      const allowNeg = opts.allowNegSlope != null ? !!opts.allowNegSlope : !!state.allowNegSlope;
      if (!allowNeg) {
        if (kind === "support" && p2 < p1) continue;
        if (kind === "resistance" && p2 > p1) continue;
      }
      const line = lineThrough(i1, p1, i2, p2);
      const ev = evaluateCandidate(bars, line, kind, winLo, actual, opts);
      if (ev.line) {
        if (!best || betterLine(ev.line, best)) best = ev.line;
      } else {
        noteMiss(miss, ev);
      }
    }
  }
  return { line: best, miss };
}

function lineFitBars(bars, skip) {
  skip = skip | 0;
  if (skip <= 0) return bars;
  const cut = bars.length - skip;
  if (cut < 80) return bars;
  return bars.slice(0, cut);
}

function analyzeSymbol(bars, mode, skipLast = 0, fitOpts = {}) {
  const fit = lineFitBars(bars, skipLast);
  const windows = mode === "auto"
    ? CFG.windows
    : [parseInt(mode, 10)].filter(Boolean);
  const allowNeg = fitOpts.allowNegSlope != null ? !!fitOpts.allowNegSlope : !!state.allowNegSlope;

  const found = {};
  const why = { support: null, resistance: null };
  function searchKind(kind, opts) {
    let miss = emptyMiss();
    let windowsTried = 0;
    for (const lookback of windows) {
      const actual = Math.min(lookback, fit.length);
      if (actual < 80 && lookback >= 80) continue;
      windowsTried++;
      const got = collectSideLine(fit, actual, kind, { ...opts, allowNegSlope: allowNeg });
      if (got.line) return { line: got.line, miss: null, windowsTried };
      miss = mergeMiss(miss, got.miss);
      if (actual >= fit.length) break;
    }
    return { line: null, miss, windowsTried };
  }
  for (const kind of ["support", "resistance"]) {
    const got = searchKind(kind, {});
    if (got.line) found[kind] = got.line;
    else why[kind] = formatWhy(kind, got.miss, got.windowsTried === 0);
  }

  const up = found.support || null;
  const down = found.resistance || null;
  let usedWindow = null;
  for (const L of [up, down]) {
    if (L?.windowSize) usedWindow = usedWindow == null ? L.windowSize : Math.max(usedWindow, L.windowSize);
  }

  const out = { up, down, window: usedWindow, bars, why, autoNegSlope: false };
  if (!allowNeg && !fitOpts._noRetry && !up && !down) {
    const retry = analyzeSymbol(bars, mode, skipLast, { allowNegSlope: true, _noRetry: true });
    if (retry.up || retry.down) {
      retry.autoNegSlope = true;
      return retry;
    }
  }
  return out;
}

/* ========== Chart drawing ========== */
const FONT_MONO = '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace';
const FONT_SANS = '"Public Sans", "Noto Sans TC", system-ui, sans-serif';

function fmtPrice(p) {
  if (!Number.isFinite(p)) return "—";
  if (Math.abs(p) >= 1000) return p.toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (Math.abs(p) >= 100) return p.toFixed(1);
  return p.toFixed(2);
}

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function lineColorOf(L, c) {
  if (L.type === "creek") return c.creek;
  if (L.type === "ice") return c.ice;
  if (L.type === "uptrend") return c.tlUp;
  return c.tlDown;
}

function lineNameOf(L) {
  if (L.type === "creek") return "Creek";
  if (L.type === "ice") return "Ice";
  if (L.type === "uptrend") return "趨勢線↑";
  return "趨勢線↓";
}

/**
 * Draw one daily chart on a canvas, sized from its rendered width.
 * opts: { date, compact, window }
 */
/** Chartpack 若只存最後 N 根，觸點索引仍可能是完整序列；平移到目前 bars。 */
function rebaseAnalysis(analysis, nBars) {
  if (!analysis || !nBars) return analysis;
  const lines = [analysis.up, analysis.down].filter(Boolean);
  if (!lines.length) return analysis;
  const idxs = [];
  for (const L of lines) {
    for (const v of [L.drawFrom, L.drawTo, L.start, ...(L.touches || [])]) {
      if (v != null) idxs.push(v);
    }
  }
  const maxI = idxs.length ? Math.max(...idxs) : 0;
  if (maxI < nBars) return analysis;
  let nFull = maxI + 1;
  for (const L of lines) {
    if (L.start != null && L.windowSize) nFull = Math.max(nFull, L.start + L.windowSize);
  }
  const offset = nFull - nBars;
  if (offset <= 0) return analysis;
  const shift = (L) => {
    if (!L) return L;
    const line = L.line
      ? { m: L.line.m, b: L.line.b + L.line.m * offset }
      : L.line;
    return {
      ...L,
      line,
      start: L.start != null ? L.start - offset : L.start,
      drawFrom: L.drawFrom != null ? L.drawFrom - offset : L.drawFrom,
      drawTo: L.drawTo != null ? L.drawTo - offset : L.drawTo,
      touches: (L.touches || []).map(i => i - offset).filter(i => i >= 0)
    };
  };
  return {
    ...analysis,
    up: shift(analysis.up),
    down: shift(analysis.down)
  };
}

function drawChart(canvas, bars, analysis, symbol, opts = {}) {
  if (!canvas || !bars || !bars.length) return;
  analysis = rebaseAnalysis(analysis, bars.length);
  const c = CFG.colors;
  const compact = !!opts.compact;

  const cssW = Math.max(
    260,
    Math.round(canvas.clientWidth || canvas.parentElement?.clientWidth || (compact ? 460 : 900))
  );
  const ratio = compact ? (cssW < 520 ? 0.62 : 0.54) : 0.56;
  let cssH = Math.round(cssW * ratio);
  const mobile = window.matchMedia("(max-width: 980px)").matches;
  if (compact) {
    cssH = Math.max(180, cssH);
  } else if (mobile) {
    const cap = Math.round((window.visualViewport?.height || window.innerHeight) * 0.44);
    cssH = Math.max(220, Math.min(cssH, cap));
  } else {
    cssH = Math.max(360, cssH);
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(cssW * dpr);
  const bh = Math.round(cssH * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  canvas.style.height = cssH + "px";

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const total = bars.length;
  const rightPad = compact ? (CFG.packRightPadBars | 0) : (CFG.chartRightPadBars | 0);
  const defaultWin = (compact ? 260 : (CFG.chartWindow || 600)) + rightPad;
  let win = opts.window || defaultWin;
  win = Math.max(1, Math.min(total + rightPad, win));
  let end = opts.end != null ? opts.end : total + rightPad;
  if (compact) end = Math.max(win, Math.min(total + rightPad, end));
  else end = Math.max(win, Math.min(total + win - 1, end));
  const start = end - win;
  const n = win;
  const visFrom = Math.max(0, start);
  const visTo = Math.min(total, start + n);
  if (visFrom >= visTo) return;

  const pad = compact
    ? { t: 12, r: 54, b: 21, l: 6 }
    : { t: 52, r: 68, b: 34, l: 8 };

  const lineObjs = [analysis?.up, analysis?.down].filter(L => L?.line);

  let lo = Infinity;
  let hi = -Infinity;
  for (let i = visFrom; i < visTo; i++) {
    lo = Math.min(lo, bars[i].l);
    hi = Math.max(hi, bars[i].h);
  }
  for (const L of lineObjs) {
    const a = Math.max(visFrom, L.drawFrom ?? L.touches?.[0] ?? visFrom);
    const b = visTo - 1;
    for (let i = a; i <= b; i++) {
      const y = yAt(L.line, i);
      if (Number.isFinite(y)) {
        lo = Math.min(lo, y);
        hi = Math.max(hi, y);
      }
    }
    const yEnd = yAt(L.line, start + n - 0.5);
    if (Number.isFinite(yEnd)) {
      lo = Math.min(lo, yEnd);
      hi = Math.max(hi, yEnd);
    }
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
  if (!compact && opts.yRange && opts.yRange.hi > opts.yRange.lo) {
    lo = opts.yRange.lo;
    hi = opts.yRange.hi;
  } else {
    const span = hi - lo || Math.abs(hi) * 0.02 || 1;
    lo -= span * 0.07;
    hi += span * 0.07;
  }

  const left = pad.l;
  const top = pad.t;
  const pw = cssW - pad.l - pad.r;
  const ph = cssH - pad.t - pad.b;
  const xAt = i => left + ((i + 0.5) / n) * pw;
  const yPx = p => top + ((hi - p) / (hi - lo)) * ph;
  const candleW = Math.max(1.1, Math.min(9, (pw / n) * 0.62));
  const mono = (size, weight = 500) => `${weight} ${size}px ${FONT_MONO}`;
  const sans = (size, weight = 400) => `${weight} ${size}px ${FONT_SANS}`;
  const labelSize = compact ? 9.5 : 10.5;

  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, cssW, cssH);

  /* y grid + price labels (right side) */
  const rows = compact ? 4 : 5;
  for (let g = 0; g <= rows; g++) {
    const y = Math.round(top + (ph * g) / rows) + 0.5;
    ctx.strokeStyle = c.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(left + pw, y);
    ctx.stroke();

    const price = hi - ((hi - lo) * g) / rows;
    ctx.font = mono(compact ? 10 : 11);
    ctx.fillStyle = c.text;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(fmtPrice(price), left + pw + 8, y);
  }

  /* x labels + ticks (with faint vertical guides) */
  const tickCount = compact ? 3 : (cssW < 620 ? 4 : 6);
  ctx.font = mono(compact ? 9.5 : 10.5);
  ctx.textBaseline = "top";
  for (let k = 0; k < tickCount; k++) {
    const slot = Math.round((k / (tickCount - 1)) * (n - 1));
    const di = start + slot;
    if (di < 0 || di >= total) continue;
    const x = Math.round(xAt(slot)) + 0.5;
    ctx.strokeStyle = c.grid;
    ctx.lineWidth = 1;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, top + ph);
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x, top + ph);
    ctx.lineTo(x, top + ph + 4);
    ctx.stroke();

    ctx.fillStyle = c.text;
    ctx.textAlign = k === 0 ? "left" : k === tickCount - 1 ? "right" : "center";
    ctx.fillText(fmtDate(bars[di].t), x, top + ph + 7);
  }

  /* candles — 忽略的最新 N 根降不透明度 */
  const skipN = opts.skipLast | 0;
  const skipFrom = skipN > 0 ? total - skipN : Infinity;
  for (let i = visFrom; i < visTo; i++) {
    const b = bars[i];
    const x = Math.round(xAt(i - start)) + 0.5;
    const up = b.c >= b.o;
    const color = up ? c.up : c.down;
    if (i >= skipFrom) ctx.globalAlpha = 0.28;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yPx(b.h));
    ctx.lineTo(x, yPx(b.l));
    ctx.stroke();

    const y1 = yPx(Math.max(b.o, b.c));
    const y2 = yPx(Math.min(b.o, b.c));
    ctx.fillRect(x - candleW / 2, y1, candleW, Math.max(1, y2 - y1));
    if (i >= skipFrom) ctx.globalAlpha = 1;
  }

  /* trend lines and touches */
  const placedLabels = [];
  const lineDraws = [];
  for (const L of lineObjs) {
    const color = lineColorOf(L, c);
    const absFrom = L.drawFrom ?? L.touches?.[0] ?? start;
    const iFrom = Math.max(0, absFrom - start);
    if (iFrom > n - 1) continue;
    const xRight = left + pw;
    const iRight = n - 0.5;
    const x0 = xAt(iFrom);
    const y0 = yPx(yAt(L.line, start + iFrom));

    ctx.strokeStyle = color;
    ctx.lineWidth = 1.75;
    ctx.setLineDash(
      (L.type === "creek" || L.type === "ice") ? [7, 4] : []
    );
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(xRight, yPx(yAt(L.line, start + iRight)));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = color;
    ctx.strokeStyle = c.bg;
    ctx.lineWidth = 1;
    for (const ti of L.touches || []) {
      if (ti < visFrom || ti >= visTo) continue;
      const px = L.kind === "support" ? bars[ti].l : bars[ti].h;
      ctx.beginPath();
      ctx.arc(xAt(ti - start), yPx(px), compact ? 2 : 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    lineDraws.push({ L, color, iFrom, x0, y0 });
  }

  const boxHitsLine = (bx, by, bw, bh, L, iFrom) => {
    const pad = 3;
    for (let i = visFrom; i < visTo; i++) {
      const x = xAt(i - start);
      if (x < bx - pad || x > bx + bw + pad) continue;
      const y = yPx(yAt(L.line, i));
      if (y >= by - pad && y <= by + bh + pad) return true;
    }
    return false;
  };
  const boxHitsCandle = (bx, by, bw, bh) => {
    const pad = 2;
    for (let i = visFrom; i < visTo; i++) {
      const x = xAt(i - start);
      if (x < bx - candleW - pad || x > bx + bw + candleW + pad) continue;
      const b = bars[i];
      const yHi = yPx(b.h);
      const yLo = yPx(b.l);
      const topC = Math.min(yHi, yLo);
      const botC = Math.max(yHi, yLo);
      if (botC >= by - pad && topC <= by + bh + pad) return true;
    }
    return false;
  };
  const boxHitsLabel = (bx, by, bw, bh) => {
    const gap = 4;
    return placedLabels.some(p =>
      bx < p.x + p.w + gap && bx + bw + gap > p.x &&
      by < p.y + p.h + gap && by + bh + gap > p.y
    );
  };

  ctx.font = sans(labelSize, 600);
  for (const { L, color, iFrom, x0, y0 } of lineDraws) {
    const label = `${lineNameOf(L)} ${(L.touches || []).length}`;
    const tw = ctx.measureText(label).width;
    const boxW = tw + 10;
    const boxH = compact ? 14 : 16;
    const preferBelow = L.kind !== "resistance";
    const alongs = [10, 18, 26, 4, 34, -6];
    const dists = [12, 18, 24, 30, 8, 36];
    const signs = preferBelow ? [1, -1] : [-1, 1];
    let placed = null;
    for (const ax of alongs) {
      for (const sign of signs) {
        for (const dist of dists) {
          let bx = x0 + ax;
          let by = y0 + sign * dist - boxH / 2;
          bx = Math.max(left + 2, Math.min(left + pw - boxW - 2, bx));
          by = Math.max(top + 2, Math.min(top + ph - boxH - 2, by));
          if (boxHitsLine(bx, by, boxW, boxH, L, iFrom)) continue;
          if (boxHitsCandle(bx, by, boxW, boxH)) continue;
          if (boxHitsLabel(bx, by, boxW, boxH)) continue;
          placed = { x: bx, y: by, w: boxW, h: boxH };
          break;
        }
        if (placed) break;
      }
      if (placed) break;
    }
    if (!placed) {
      const by = Math.max(top + 2, Math.min(top + ph - boxH - 2, y0 + (preferBelow ? 14 : -14) - boxH / 2));
      const bx = Math.max(left + 2, Math.min(left + pw - boxW - 2, x0 + 10));
      placed = { x: bx, y: by, w: boxW, h: boxH };
    }
    placedLabels.push(placed);
    ctx.fillStyle = "rgba(14,15,18,0.88)";
    ctx.fillRect(placed.x, placed.y, placed.w, placed.h);
    ctx.fillStyle = color;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(label, placed.x + 5, placed.y + placed.h / 2 + 0.5);
  }

  /* close marker：跟隨視窗內最右一根實際 K，不鎖死全序列最新根 */
  const last = bars[visTo - 1];
  const lastY = yPx(last.c);
  ctx.strokeStyle = "rgba(244,245,247,0.28)";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(left, lastY);
  ctx.lineTo(left + pw, lastY);
  ctx.stroke();
  ctx.setLineDash([]);

  const chipW = pad.r - 16;
  const chipH = compact ? 15 : 18;
  ctx.fillStyle = "#1b2430";
  ctx.fillRect(left + pw + 5, lastY - chipH / 2, chipW, chipH);
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left + pw + 5.5, lastY - chipH / 2);
  ctx.lineTo(left + pw + 5.5, lastY + chipH / 2);
  ctx.stroke();
  ctx.font = mono(compact ? 9 : 10.5, 600);
  ctx.fillStyle = "#dceaf9";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(fmtPrice(last.c), left + pw + 5 + chipW / 2, lastY + 0.5);

  canvas._chartMeta = compact ? null : { left, pw, ph, top, start, n, total, lo, hi };

  /* title */
  if (!compact) {
    const quote = bars[total - 1];
    const dateStr = opts.date || new Date(quote.t).toISOString().slice(0, 10);
    const lineWin = analysis?.window || CFG.windows[0];
    const narrow = cssW < 620;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = mono(13, 600);
    ctx.fillStyle = c.textStrong;
    ctx.fillText(displaySymbol(symbol), left, 22);
    if (!narrow) {
      const symW = ctx.measureText(displaySymbol(symbol)).width;
      ctx.font = sans(11.5, 400);
      ctx.fillStyle = c.text;
      ctx.fillText(`日線 · ${dateStr} · 顯示 ${win} 根 · 做線 ${lineWin} 根`, left + symW + 12, 22);
    } else {
      ctx.font = sans(11.5, 400);
      ctx.fillStyle = c.text;
      ctx.fillText(`日線 · ${dateStr} · 顯示 ${win} 根`, left, 40);
    }

    const prev = bars[total - 2] || quote;
    const chg = prev.c ? ((quote.c - prev.c) / prev.c) * 100 : 0;
    ctx.textAlign = "right";
    ctx.font = mono(13, 600);
    ctx.fillStyle = c.textStrong;
    ctx.fillText(fmtPrice(quote.c), left + pw, 22);
    const closeW = ctx.measureText(fmtPrice(quote.c)).width;
    ctx.font = mono(11, 500);
    ctx.fillStyle = chg >= 0 ? c.up : c.down;
    ctx.fillText(`${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`, left + pw - closeW - 10, 22);
  }
}

function legendHtml(analysis) {
  const parts = [];
  const add = (L) => {
    if (!L) return;
    const cls =
      L.type === "creek" ? "c-creek" :
      L.type === "ice" ? "c-ice" :
      L.type === "uptrend" ? "c-up" : "c-down";
    const name = L.label;
    parts.push(
      `<span class="lg ${cls}"><b>${name}</b><em>${L.touches.length} 觸點 · 實體 ${L.bodyBreaks} · 引線 ${L.wickBreaks ?? 0} · ${L.windowSize}K</em></span>`
    );
  };
  const addWhy = (text) => {
    if (!text) return;
    const [head, ...rest] = String(text).split("：");
    const detail = rest.join("：") || text;
    parts.push(`<span class="lg is-why"><b>${head}</b><em>${detail}</em></span>`);
  };
  add(analysis?.up);
  if (!analysis?.up) addWhy(analysis?.why?.support);
  add(analysis?.down);
  if (!analysis?.down) addWhy(analysis?.why?.resistance);
  if (analysis?.autoNegSlope) {
    parts.push(`<span class="lg is-why"><b>斜率可負</b><em>不成線時自動開啟</em></span>`);
  }
  if (!parts.length) {
    parts.push("<span class=\"lg is-why\"><b>不成線</b><em>此視窗未能形成有效四點趨勢線</em></span>");
  }
  return parts.join("");
}

/* ========== UI ========== */
const $ = (id) => document.getElementById(id);
if (ON_PAGES) {
  const emptyCopy = $("emptyCopy");
  if (emptyCopy) emptyCopy.textContent = "選上方日期載入已掃描的 Chartpack。";
}
const PANE_IDS = ["emptyHint", "singleView", "packView"];
let paneToken = 0;
const reduceMotion = () =>
  window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function pagesStatusBesideDate(text) {
  const d = state.packDate || $("packDate")?.value || "";
  let s = String(text || "").trim();
  if (d) s = s.split(d).join("");
  s = s
    .replace(/^已開啟\s*/, "")
    .replace(/沒有\s*的\s*/g, "")
    .replace(/^[·•—\-–\s]+/, "")
    .replace(/\s*[—\-–]\s*/g, " · ")
    .replace(/\s{2,}/g, " ")
    .trim();
  return s;
}

function setStatusText(text, opts = {}) {
  const el = $("statusText");
  if (el && el.textContent !== text) {
    el.textContent = text;
    if (opts.animate !== false) replayAnim(el, "is-swap");
  }
  const meta = $("packMeta");
  if (!meta) return;
  const next = pagesStatusBesideDate(text);
  if (meta.textContent === next) return;
  meta.textContent = next;
  if (opts.animate !== false) replayAnim(meta, "is-swap");
}

function setViewerTitle(title) {
  const t = $("viewerTitle");
  const block = $("titleBlock");
  const same = t ? t.textContent === title : true;
  if (t) t.textContent = title;
  if (!same) replayAnim(block, "is-swap");
}

function scrollPageTop() {
  const stage = document.querySelector(".viewer-stage");
  if (stage) stage.scrollTop = 0;
  const viewer = document.querySelector(".viewer");
  if (viewer) viewer.scrollTop = 0;
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}

/** 檢視區面板切換（empty / single / pack） */
function showPane(id) {
  const next = $(id);
  if (!next) return;
  for (const pid of PANE_IDS) {
    const el = $(pid);
    if (el) el.hidden = false;
  }
  const current = PANE_IDS.map($).find(el => el?.classList.contains("is-on"));
  if (current === next) {
    next.classList.remove("is-exit");
    next.classList.add("is-on");
    return;
  }
  const token = ++paneToken;
  if (current) {
    current.classList.remove("is-on");
    current.classList.add("is-exit");
    const leaving = current;
    const ms = reduceMotion() ? 0 : 420;
    window.setTimeout(() => {
      if (token !== paneToken) return;
      leaving.classList.remove("is-exit");
    }, ms);
  }
  next.classList.remove("is-exit");
  if (!reduceMotion()) void next.offsetWidth;
  next.classList.add("is-on");
}

function setProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("progressBar").style.width = pct + "%";
  $("statusCount").textContent = total ? `${done} / ${total}` : "";
}

/** 近 lookback 根：突破／收回／觸碰（突破 = 實體完全穿越；收回 = 實體跌破後，之後有一根實體完全回到線內） */
function recentLineEvents(row, lookback = 5) {
  const analysis = rowAnalysis(row);
  if (!row?.bars?.length || !analysis) return { touch: false, breakout: false, reclaim: false };
  const bars = row.bars;
  const n = bars.length;
  const skip = state.ignoreLastBars | 0;
  const end = Math.max(0, n - skip);
  const from = Math.max(0, end - lookback);
  if (from >= end) return { touch: false, breakout: false, reclaim: false };
  let touch = false;
  let breakout = false;
  let reclaim = false;
  const lines = [analysis.up, analysis.down].filter(Boolean);
  for (const L of lines) {
    if (!L.line) continue;
    const resistance = L.kind === "resistance";
    let bodyBrokeAt = -1;
    for (let i = from; i < end; i++) {
      const y = yAt(L.line, i);
      const bar = bars[i];
      const bodyBrk = bodyFullCross(bar, y, resistance);
      const wickBrk = wickOnlyCross(bar, y, resistance);
      if (bodyBrk) breakout = true;
      if (bodyBrk && bodyBrokeAt < 0) bodyBrokeAt = i;
      else if (!bodyBrk && !wickBrk && isTouchBar(bar, y, resistance)) touch = true;
      if (bodyBrokeAt >= 0 && i > bodyBrokeAt && bodyFullyHeld(bar, y, resistance)) reclaim = true;
    }
  }
  if (reclaim || breakout) touch = false;
  return { touch, breakout, reclaim };
}

function recentLineEventsAt(row, skip, lookback = 5) {
  const analysis = rowAnalysis(row, skip);
  if (!row?.bars?.length || !analysis) return { touch: false, breakout: false, reclaim: false };
  const bars = row.bars;
  const n = bars.length;
  const end = Math.max(0, n - (skip | 0));
  const from = Math.max(0, end - lookback);
  if (from >= end) return { touch: false, breakout: false, reclaim: false };
  let touch = false;
  let breakout = false;
  let reclaim = false;
  const lines = [analysis.up, analysis.down].filter(Boolean);
  for (const L of lines) {
    if (!L.line) continue;
    const resistance = L.kind === "resistance";
    let bodyBrokeAt = -1;
    for (let i = from; i < end; i++) {
      const y = yAt(L.line, i);
      const bar = bars[i];
      const bodyBrk = bodyFullCross(bar, y, resistance);
      const wickBrk = wickOnlyCross(bar, y, resistance);
      if (bodyBrk) breakout = true;
      if (bodyBrk && bodyBrokeAt < 0) bodyBrokeAt = i;
      else if (!bodyBrk && !wickBrk && isTouchBar(bar, y, resistance)) touch = true;
      if (bodyBrokeAt >= 0 && i > bodyBrokeAt && bodyFullyHeld(bar, y, resistance)) reclaim = true;
    }
  }
  if (reclaim || breakout) touch = false;
  return { touch, breakout, reclaim };
}

function casesKey() {
  return state.allowNegSlope ? "1" : "0";
}

function collectSignalCases(row) {
  if (!row?.bars) return [];
  const key = casesKey();
  if (!row._casesBy) row._casesBy = {};
  if (row._casesBy[key]) return row._casesBy[key];
  const max = CFG.skipLastBarsMax || 20;
  const out = [];
  for (let skip = 0; skip <= max; skip++) {
    const ev = recentLineEventsAt(row, skip);
    if (ev.breakout || ev.reclaim) out.push({ skip, breakout: ev.breakout, reclaim: ev.reclaim });
  }
  row._casesBy[key] = out;
  return out;
}

function signalSkipWindow() {
  const max = CFG.skipLastBarsMax || 20;
  if (state.filters.past) return { lo: 1, hi: max };
  if (state.filters.breakout || state.filters.reclaim) return { lo: 0, hi: 0 };
  return null;
}

function kindWanted() {
  const breakout = !!state.filters.breakout;
  const reclaim = !!state.filters.reclaim;
  if (breakout || reclaim) return { breakout, reclaim };
  if (state.filters.past) return { breakout: true, reclaim: true };
  return { breakout: false, reclaim: false };
}

function caseKindHit(c, kinds) {
  return (kinds.breakout && c.breakout) || (kinds.reclaim && c.reclaim);
}

function hasKindInSkips(row, kinds, lo, hi) {
  if (!row?.bars || row.error) return false;
  const key = casesKey();
  if (row._casesBy?.[key]) {
    return row._casesBy[key].some(c => c.skip >= lo && c.skip <= hi && caseKindHit(c, kinds));
  }
  try {
    for (let skip = lo; skip <= hi; skip++) {
      const ev = recentLineEventsAt(row, skip);
      if (caseKindHit(ev, kinds)) return true;
    }
  } catch (e) { /* keep false */ }
  return false;
}

function listedPastCases(row) {
  if (!row?.bars) return [];
  return collectSignalCases(row).filter(caseMatchesFilter);
}

function caseAppliedSkip(row) {
  if (!row?.symbol) return null;
  if (Object.prototype.hasOwnProperty.call(state.casePick, row.symbol)) {
    const v = state.casePick[row.symbol] | 0;
    return v < 0 ? null : v;
  }
  if (state.filters.past) {
    const first = listedPastCases(row)[0];
    return first ? (first.skip | 0) : null;
  }
  if (state.filterSkip) return state.ignoreLastBars | 0;
  return null;
}

function caseSkipForRow(row) {
  const v = caseAppliedSkip(row);
  return v == null ? 0 : v;
}

function caseIsOn(row, skip) {
  const v = caseAppliedSkip(row);
  return v != null && v === (skip | 0);
}

function adoptCaseSkip(row) {
  if (!row?.symbol) return;
  if (Object.prototype.hasOwnProperty.call(state.casePick, row.symbol)) {
    const v = state.casePick[row.symbol] | 0;
    state.ignoreLastBars = v < 0 ? 0 : v;
    return;
  }
  if (state.filters.past) {
    const first = listedPastCases(row)[0];
    if (first) state.ignoreLastBars = first.skip | 0;
  }
}

function applySignalCase(row, skip) {
  if (!row) return;
  skip = skip | 0;
  state.selected = row.symbol;
  if (caseIsOn(row, skip)) {
    state.casePick[row.symbol] = -1;
    state.filterSkip = false;
    state.ignoreLastBars = 0;
  } else {
    state.casePick[row.symbol] = skip;
    state.filterSkip = true;
    state.ignoreLastBars = skip;
  }
  if (state.view === "pack" && packViewOn()) {
    renderPack();
    renderList();
    syncFilterChips({ popKey: "skip" });
    return;
  }
  showSingle(row, { skipScroll: true });
  setView("single");
  syncFilterChips({ popKey: "skip" });
}

function toggleFilterFromTag(kind, e) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  if (!Object.prototype.hasOwnProperty.call(state.filters, kind)) return;
  state.filters[kind] = !state.filters[kind];
  applyFilters({ popKey: kind });
}

function addFilterTag(box, kind, label, cls) {
  const t = document.createElement("span");
  t.className = "tag " + cls + (state.filters[kind] ? " is-filter" : "");
  t.textContent = label;
  t.title = "篩選" + label;
  t.onclick = (e) => toggleFilterFromTag(kind, e);
  box.appendChild(t);
}

function caseMatchesFilter(c) {
  const win = signalSkipWindow();
  if (!win) return true;
  if (c.skip < win.lo || c.skip > win.hi) return false;
  return caseKindHit(c, kindWanted());
}

function fillSignalCases(box, row, opts = {}) {
  box.innerHTML = "";
  if (!row?.bars || row.error) {
    if (!opts.compact) {
      const p = document.createElement("p");
      p.className = "case-empty";
      p.textContent = "無資料";
      box.appendChild(p);
    }
    return false;
  }
  const cases = listedPastCases(row);
  if (!cases.length) {
    if (!opts.compact) {
      const p = document.createElement("p");
      p.className = "case-empty";
      p.textContent = "忽略 0–20 根下沒有突破／收回";
      box.appendChild(p);
    }
    return false;
  }
  for (const c of cases) {
    const el = document.createElement("button");
    el.type = "button";
    const on = caseIsOn(row, c.skip);
    el.className = "signal-case" + (on ? " is-on" : "");
    el.setAttribute("aria-pressed", on ? "true" : "false");
    el.title = on ? "再點一次取消套用" : "套用此忽略";
    const skipEl = document.createElement("span");
    skipEl.className = "skip";
    skipEl.textContent = c.skip ? `忽略${c.skip}` : "不忽略";
    const tags = document.createElement("span");
    tags.className = "tags";
    if (c.reclaim) addFilterTag(tags, "reclaim", "收回", "is-reclaim");
    if (c.breakout) addFilterTag(tags, "breakout", "突破", "is-break");
    el.appendChild(skipEl);
    el.appendChild(tags);
    el.onclick = (e) => {
      if (opts.stop) e.stopPropagation();
      applySignalCase(row, c.skip);
    };
    box.appendChild(el);
  }
  return true;
}

function renderSignalCases(row) {
  const box = $("signalCaseList");
  if (!box) return;
  fillSignalCases(box, row);
}

function anyFilterOn() {
  return !!(state.filters.breakout || state.filters.reclaim || state.filters.touch || state.filters.past);
}

function rowIndexes(row) {
  if (Array.isArray(row?.indexes) && row.indexes.length) return row.indexes;
  if (row?.index && INDEXES[row.index]) return [row.index];
  return null;
}

function matchesIndex(row) {
  if (state.index === "all") return true;
  const idxs = rowIndexes(row);
  if (!idxs) return true;
  return idxs.includes(state.index);
}

function matchesFilters(row) {
  if (!matchesIndex(row)) return false;
  if (!anyFilterOn()) return true;
  if (row.error || !row.bars) return false;
  const want = [];
  const win = signalSkipWindow();
  if (win) want.push(hasKindInSkips(row, kindWanted(), win.lo, win.hi));
  if (state.filters.touch) want.push(recentLineEvents(row).touch);
  return want.some(Boolean);
}

function filteredResults() {
  return state.results.filter(matchesFilters);
}

function syncFilterChips(opts = {}) {
  const map = [
    ["filterBreakout", "breakout"],
    ["filterReclaim", "reclaim"],
    ["filterTouch", "touch"],
    ["filterPast", "past"]
  ];
  for (const [id, key] of map) {
    const el = $(id);
    if (!el) continue;
    const on = !!state.filters[key];
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    if (opts.popKey === key) replayAnim(el, "is-pop");
  }
  const skipN = state.ignoreLastBars | 0;
  const skipToggle = $("filterSkipToggle");
  const skipWrap = $("skipCalWrap");
  const skipOpen = !!skipWrap?.classList.contains("is-open");
  const skipVal = $("skipCalValue");
  if (skipVal) skipVal.textContent = String(skipN);
  if (skipToggle) {
    skipToggle.textContent = skipN ? `忽略${skipN}根` : "忽略";
    skipToggle.classList.toggle("active", skipN > 0 || skipOpen);
    skipToggle.setAttribute("aria-pressed", skipN > 0 ? "true" : "false");
    skipToggle.setAttribute("aria-expanded", skipOpen ? "true" : "false");
    if (opts.popKey === "skip" && skipN > 0) replayAnim(skipToggle, "is-pop");
  }
  document.querySelectorAll("#skipLastBtns [data-skip]").forEach(el => {
    const on = (el.dataset.skip | 0) === skipN;
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    if (on && opts.popKey === "skip") replayAnim(el, "is-pop");
  });
  const skipAlso = $("filterSkipAlso");
  if (skipAlso) {
    const on = !!state.filterSkip;
    skipAlso.classList.toggle("active", on);
    skipAlso.setAttribute("aria-pressed", on ? "true" : "false");
    if (opts.popKey === "filterSkip") replayAnim(skipAlso, "is-pop");
  }
  const negSlope = $("filterNegSlope");
  if (negSlope) {
    const autoOn = currentAutoNegSlope();
    const on = !!state.allowNegSlope || autoOn;
    negSlope.classList.toggle("active", on);
    negSlope.setAttribute("aria-pressed", on ? "true" : "false");
    negSlope.title = autoOn && !state.allowNegSlope
      ? "不成線時已自動開啟斜率可負"
      : "開啟後支撐／壓力斜率正負不限";
    if (opts.popKey === "negSlope") replayAnim(negSlope, "is-pop");
  }
  const ok = state.results.filter(r => r.bars).length;
  const n = opts.skipCount ? ok : filteredResults().filter(r => r.bars).length;
  const meta = $("filterMeta");
  if (meta) {
    const tags = [];
    if (state.filters.breakout) tags.push("突破");
    if (state.filters.reclaim) tags.push("收回");
    if (state.filters.touch) tags.push("觸碰");
    if (state.filters.past) tags.push("過去訊號");
    const skip = state.ignoreLastBars
      ? `略過最新 ${state.ignoreLastBars} 根${state.filterSkip ? "（篩選忽略）" : ""} · `
      : "";
    const slope = state.allowNegSlope ? "斜率可負 · " : "";
    const mode = skip + slope;
    meta.innerHTML = tags.length
      ? `${mode}篩選 <strong>${tags.join(" + ")}</strong> · <strong>${n}</strong> / ${ok} 檔`
      : `${mode}顯示全部 · <strong>${ok}</strong> 檔`;
    replayAnim(meta, "is-swap");
  }
}

function packViewOn() {
  return state.view === "pack" || !!$("packView")?.classList.contains("is-on");
}

/** 清單 + Chartpack 同步套用篩選 */
function applyFilters(opts = {}) {
  syncFilterChips({ ...opts, skipCount: true });
  const run = () => {
    renderList({ animate: true });
    if (packViewOn() && state.results.some(r => r.bars)) {
      renderPack();
    } else if (state.view === "single" && state.selected) {
      const row = filteredResults().find(r => r.symbol === state.selected)
        || filteredResults().find(r => r.bars);
      if (row) {
        state.selected = row.symbol;
        showSingle(row, { pickFirstPast: opts.popKey === "past" && !!state.filters.past });
        renderList({ animate: true });
      }
    }
    syncFilterChips(opts);
  };
  if (state.filters.past) requestAnimationFrame(run);
  else run();
}

function renderList(opts = {}) {
  const box = $("resultList");
  box.innerHTML = "";
  if (opts.animate) replayAnim(box, "is-swap");
  const universe = state.results.filter(matchesIndex);
  const ok = universe.filter(r => r.bars).length;
  const filtered = filteredResults();
  // 更新篩選列計數（避免與 applyFilters 循環：此處只刷新 meta 文字）
  const meta = $("filterMeta");
  if (meta) {
    const tags = [];
    if (state.filters.breakout) tags.push("突破");
    if (state.filters.reclaim) tags.push("收回");
    if (state.filters.touch) tags.push("觸碰");
    if (state.filters.past) tags.push("過去訊號");
    const n = filtered.filter(r => r.bars).length;
    meta.innerHTML = tags.length
      ? `篩選 <strong>${tags.join(" + ")}</strong> · <strong>${n}</strong> / ${ok} 檔`
      : `顯示全部 · <strong>${ok}</strong> 檔`;
  }
  const listCount = $("listCount");
  if (listCount) {
    const active = anyFilterOn();
    const next = active
      ? `${filtered.filter(r => r.bars).length} / ${ok} 檔`
      : `${ok} / ${universe.length} 檔`;
    if (listCount.textContent !== next) {
      listCount.textContent = next;
      replayAnim(listCount, "is-swap");
    }
  }
  filtered.forEach((r, idx) => {
    const ev = (!r.error && r.bars) ? recentLineEvents(r) : { touch: false, breakout: false };
    const el = document.createElement("div");
    el.className = "list-item"
      + (state.selected === r.symbol ? " active" : "")
      + (r.error ? " err" : "");
    const symEl = document.createElement("span");
    symEl.className = "sym";
    symEl.textContent = displaySymbol(r.symbol);
    el.appendChild(symEl);

    const tagBox = document.createElement("span");
    tagBox.className = "tags";
    const hints = [];
    if (r.error) {
      const t = document.createElement("span");
      t.className = "tag is-err";
      t.textContent = "無資料";
      tagBox.appendChild(t);
    } else {
      const a = rowAnalysis(r);
      if (ev.reclaim) {
        hints.push("收回");
        const t = document.createElement("span");
        t.className = "tag is-reclaim";
        t.textContent = "收回";
        tagBox.appendChild(t);
      } else if (ev.breakout) {
        hints.push("突破");
        const t = document.createElement("span");
        t.className = "tag is-break";
        t.textContent = "突破";
        tagBox.appendChild(t);
      } else if (ev.touch) {
        hints.push("觸碰");
        const t = document.createElement("span");
        t.className = "tag is-touch";
        t.textContent = "觸碰";
        tagBox.appendChild(t);
      } else if (!a?.up && !a?.down) {
        const why = [a?.why?.support, a?.why?.resistance].filter(Boolean);
        hints.push(...why);
        const t = document.createElement("span");
        t.className = "tag is-err";
        t.textContent = "不成線";
        tagBox.appendChild(t);
      }
    }
    el.appendChild(tagBox);
    el.tabIndex = 0;
    el.title = r.error || (hints.length ? `${r.symbol} · ${hints.join(" · ")}` : r.symbol);
    el.setAttribute("role", "button");
    el.style.animationDelay = `${Math.min(idx, 40) * 14}ms`;
    el.onclick = () => {
      state.selected = r.symbol;
      renderList();
      showSingle(r);
      setView("single");
    };
    el.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        el.click();
      }
    };
    box.appendChild(el);
  });
  const activeEl = box.querySelector(".list-item.active");
  if (activeEl) {
    if (window.matchMedia("(max-width: 980px)").matches) {
      const left = activeEl.offsetLeft - (box.clientWidth - activeEl.offsetWidth) / 2;
      box.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
    } else {
      activeEl.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }
}

function currentAutoNegSlope() {
  if (state.view !== "single" || !state.selected) return false;
  const row = state.results.find(r => r.symbol === state.selected);
  if (!row?.bars) return false;
  return !!rowAnalysis(row, state.ignoreLastBars)?.autoNegSlope;
}

function rowAnalysis(row, skipOverride) {
  if (!row?.bars) return row?.analysis || null;
  const skip = skipOverride != null
    ? (skipOverride | 0)
    : (state.filterSkip ? (state.ignoreLastBars | 0) : 0);
  const recent = recentTouchN();
  const key = skip + ":" + recent + ":" + (state.allowNegSlope ? "1" : "0");
  if (!row._skipBy) row._skipBy = {};
  if (!row._skipBy[key]) {
    row._skipBy[key] = analyzeSymbol(row.bars, "auto", skip);
  }
  return row._skipBy[key];
}

function analyzeRow(symbol, fullBars, dateStr) {
  const bars = barsAsOf(fullBars, dateStr);
  if (bars.length < 50) throw new Error("該日期前資料不足");
  const analysis = analyzeSymbol(bars, "auto");
  if (analysis.up) analysis.up.windowSize = analysis.up.windowSize || analysis.window;
  if (analysis.down) analysis.down.windowSize = analysis.down.windowSize || analysis.window;
  return { symbol, bars, analysis };
}

const CHART_ZOOM_MIN = 20;

function defaultChartView(bars) {
  const n = bars?.length || 0;
  const rightPad = CFG.chartRightPadBars | 0;
  const win = Math.min(n, CFG.chartWindow || 600) + rightPad;
  return { win, end: n + rightPad };
}

function clampChartView(bars, view) {
  const n = bars.length;
  const rightPad = CFG.chartRightPadBars | 0;
  const maxWin = n + rightPad;
  const win = Math.max(Math.min(CHART_ZOOM_MIN, maxWin), Math.min(maxWin, Math.round(view.win)));
  const end = Math.max(win, Math.min(n + win - 1, Math.round(view.end)));
  return { win, end };
}

function applyChartView(bars, next) {
  state.chartView = clampChartView(bars, next);
  return state.chartView;
}

function redrawMainChart(row) {
  const r = row || state.results.find(x => x.symbol === state.selected);
  if (!r?.bars || r.error) return;
  const v = applyChartView(r.bars, state.chartView || defaultChartView(r.bars));
  drawChart($("mainCanvas"), r.bars, rowAnalysis(r, state.ignoreLastBars), r.symbol, {
    date: state.packDate,
    window: v.win,
    end: v.end,
    yRange: state.chartY,
    skipLast: state.ignoreLastBars
  });
}

function showSingle(r, opts = {}) {
  state.view = "single";
  showPane("singleView");
  if (opts.pickFirstPast && r?.symbol) delete state.casePick[r.symbol];
  adoptCaseSkip(r);
  const btnS = $("btnSingle");
  const btnP = $("btnPack");
  if (btnS && !btnS.classList.contains("active")) replayAnim(btnS, "is-pop");
  if (btnP && btnP.classList.contains("active")) replayAnim(btnP, "is-pop");
  btnS?.classList.toggle("active", true);
  btnP?.classList.toggle("active", false);
  setViewerTitle(
    displaySymbol(r.symbol) || "單圖",
    r.error
      ? String(r.error)
      : ((state.packDate ? `日線 · ${state.packDate}` : "日線單圖") + " · 滾輪縮放 · 拖曳平移 · 雙擊還原")
  );
  const wrap = $("mainCanvas")?.closest(".chart-wrap");
  if (r.error || !r.bars) {
    $("mainLegend").textContent = r.error || "無資料";
    replayAnim(wrap, "is-swap");
    renderSignalCases(r);
    if (!opts.skipScroll) scrollPageTop();
    return;
  }
  const analysis = rowAnalysis(r, state.ignoreLastBars);
  if (state.chartSymbol !== r.symbol) {
    state.chartSymbol = r.symbol;
    state.chartView = defaultChartView(r.bars);
    state.chartY = null;
  }
  redrawMainChart(r);
  $("mainLegend").innerHTML = legendHtml(analysis);
  replayAnim(wrap, "is-swap");
  renderSignalCases(r);
  syncFilterChips({ skipCount: true });
  if (!opts.skipScroll) scrollPageTop();
}

function renderPack() {
  const box = $("packView");
  box.innerHTML = "";
  let i = 0;
  const rows = filteredResults().filter(r => r.bars);
  for (const r of rows) {
    const card = document.createElement("div");
    card.className = "pack-card";
    card.style.animationDelay = `${Math.min(i, 24) * 28}ms`;
    i++;
    const canvas = document.createElement("canvas");
    canvas.width = 900;
    canvas.height = 486;
    const head = document.createElement("header");
    const skip = caseSkipForRow(r);
    const ev = recentLineEventsAt(r, skip);
    const symEl = document.createElement("span");
    symEl.className = "sym";
    symEl.textContent = displaySymbol(r.symbol);
    const dateEl = document.createElement("span");
    dateEl.className = "pack-date";
    dateEl.textContent = state.packDate || "";
    const headLeft = document.createElement("span");
    headLeft.style.display = "flex";
    headLeft.style.alignItems = "baseline";
    headLeft.style.gap = "8px";
    headLeft.appendChild(symEl);
    headLeft.appendChild(dateEl);
    const tagBox = document.createElement("span");
    tagBox.className = "tags";
    if (ev.reclaim) addFilterTag(tagBox, "reclaim", "收回", "is-reclaim");
    else if (ev.breakout) addFilterTag(tagBox, "breakout", "突破", "is-break");
    else if (ev.touch) addFilterTag(tagBox, "touch", "觸碰", "is-touch");
    head.appendChild(headLeft);
    head.appendChild(tagBox);
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = legendHtml(rowAnalysis(r, skip));
    card.appendChild(head);
    card.appendChild(canvas);
    card.appendChild(info);
    const pastBox = document.createElement("div");
    pastBox.className = "pack-past";
    const pastHead = document.createElement("h4");
    pastHead.textContent = "過去訊號";
    const pastList = document.createElement("div");
    pastBox.appendChild(pastHead);
    pastBox.appendChild(pastList);
    if (!fillSignalCases(pastList, r, { compact: true, stop: true })) {
      const p = document.createElement("p");
      p.className = "case-empty";
      p.textContent = "無突破／收回";
      pastList.appendChild(p);
    }
    card.appendChild(pastBox);
    card.tabIndex = 0;
    card.onclick = () => {
      state.selected = r.symbol;
      renderList();
      showSingle(r);
      setView("single");
    };
    card.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        card.click();
      }
    };
    box.appendChild(card);
    drawChart(canvas, r.bars, rowAnalysis(r, skip), r.symbol, {
      date: state.packDate,
      compact: true,
      skipLast: skip
    });
  }
  if (!box.children.length) {
    const active = anyFilterOn();
    box.innerHTML = active
      ? `<div class="empty"><div class="empty-ico"></div><h3>沒有符合篩選的圖表</h3><p>試試「突破」「收回」「觸碰」或「過去訊號」，或清除篩選。</p></div>`
      : `<div class="empty"><div class="empty-ico"></div><h3>尚無可用圖表</h3><p>掃描完成後會顯示在這裡。</p></div>`;
  }
}

function setView(v) {
  if (v === "empty") {
    state.view = "single";
    showPane("emptyHint");
    $("btnSingle")?.classList.remove("active");
    $("btnPack")?.classList.remove("active");
    setViewerTitle("圖表區", "選左側代號檢視單圖，或切換 Chartpack");
    return;
  }
  state.view = v;
  const has = state.results.some(r => r.bars);
  const btnS = $("btnSingle");
  const btnP = $("btnPack");
  const wantSingle = v === "single" && has;
  const wantPack = v === "pack" && has;
  if (btnS && btnS.classList.contains("active") !== wantSingle) replayAnim(btnS, "is-pop");
  if (btnP && btnP.classList.contains("active") !== wantPack) replayAnim(btnP, "is-pop");
  btnS?.classList.toggle("active", wantSingle);
  btnP?.classList.toggle("active", wantPack);

  if (!has) {
    showPane("emptyHint");
    setViewerTitle("圖表區", "選左側代號檢視單圖，或切換 Chartpack");
    return;
  }
  if (v === "pack") {
    showPane("packView");
    const n = filteredResults().filter(r => r.bars).length;
    setViewerTitle("Chartpack", `${state.packDate || ""} · ${n} 檔`);
    renderPack();
    return;
  }
  showPane("singleView");
  setViewerTitle(
    displaySymbol(state.selected) || "單圖",
    state.packDate ? `日線 · ${state.packDate}` : "日線單圖"
  );
  scrollPageTop();
}

function updatePackButton() {
  const has = state.results.some(r => r.bars);
  $("btnPack").disabled = !has;
  $("btnSingle").disabled = !has;
  $("btnSave").disabled = !has;
}

function buildPackPayload(dateStr) {
  return {
    date: dateStr,
    index: state.index,
    indexLabel: currentIndexConfig().label,
    indexes: Object.keys(INDEXES),
    savedAt: new Date().toISOString(),
    count: state.results.filter(r => r.bars).length,
    results: state.results.map(r => {
      if (r.error || !r.bars) {
        return { symbol: r.symbol, error: r.error || "no data", index: r.index, indexes: r.indexes };
      }
      return {
        symbol: r.symbol,
        index: r.index,
        indexes: r.indexes,
        bars: r.bars,
        analysis: {
          window: r.analysis.window,
          up: r.analysis.up || null,
          down: r.analysis.down || null,
          why: r.analysis.why || null
        }
      };
    })
  };
}

async function refreshSavedPacks(selectDate) {
  const sel = $("savedPacks");
  try {
    let dates = [];
    if (ON_PAGES) {
      const res = await fetch(packAsset("manifest.json"), { cache: "no-store" });
      const json = await res.json();
      const packs = (json.packs || []).filter(p => {
        if (!state.index || state.index === "all") return true;
        return p.index === state.index;
      });
      dates = [...new Set(packs.map(p => p.date))];
    } else {
      const res = await fetch(`${LOCAL_BASE}/api/packs`);
      const json = await res.json();
      dates = json.dates || [];
    }
    const keep = selectDate || sel.value || state.packDate;
    sel.innerHTML = "";
    if (!dates.length) {
      sel.innerHTML = `<option value="">— 無 —</option>`;
      $("btnOpen").disabled = true;
      return dates;
    }
    for (const d of dates) {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    }
    if (keep && dates.includes(keep)) sel.value = keep;
    $("btnOpen").disabled = !sel.value;
    return dates;
  } catch (e) {
    sel.innerHTML = `<option value="">— 無法讀取 —</option>`;
    $("btnOpen").disabled = true;
    return [];
  }
}

async function savePack(dateStr) {
  if (ON_PAGES) {
    setStatusText("GitHub Pages 為唯讀；結果由 Actions 掃描寫入倉庫");
    return false;
  }
  const d = dateStr || state.packDate || $("packDate").value || todayISO();
  if (!state.results.some(r => r.bars)) {
    setStatusText("無可保存的 Chartpack");
    return false;
  }
  setStatusText(`保存 ${d} Chartpack…`);
  try {
    const payload = buildPackPayload(d);
    const res = await fetch(`${LOCAL_BASE}/api/packs/${encodeURIComponent(d)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || ("HTTP " + res.status));
    await refreshSavedPacks(d);
    setStatusText(`已保存 ${d} · ${payload.count} 檔`);
    return true;
  } catch (e) {
    setStatusText(`保存失敗：${e.message || e}`);
    return false;
  }
}

function mapPackRow(r, json) {
  const bars = r.bars || null;
  const analysis = bars && r.analysis ? rebaseAnalysis(r.analysis, bars.length) : (r.analysis || null);
  const idx = r.index || json.index || null;
  const indexes = r.indexes || (idx ? [idx] : null);
  return {
    symbol: r.symbol,
    error: r.error || null,
    index: idx,
    indexes,
    bars,
    analysis
  };
}

async function fetchPackJson(file) {
  const res = await fetch(packAsset(file), { cache: "no-store" });
  if (!res.ok) return null;
  const json = await res.json();
  if (json?.error) return null;
  return json;
}

async function openPack(dateStr) {
  const d = dateStr || $("savedPacks").value || $("packDate").value;
  if (!d) {
    setStatusText("請先選擇已存日期");
    return false;
  }
  setStatusText(`開啟 ${d} Chartpack…`);
  try {
    let json = null;
    if (ON_PAGES) {
      if (state.index === "all") {
        const bySym = new Map();
        for (const key of Object.keys(INDEXES)) {
          const part = await fetchPackJson(`${key}-${d}.json`);
          if (!part) continue;
          json = json || part;
          for (const r of part.results || []) {
            const row = mapPackRow(r, part);
            const prev = bySym.get(row.symbol);
            if (!prev) {
              bySym.set(row.symbol, row);
              continue;
            }
            const merged = new Set([...(prev.indexes || []), ...(row.indexes || [])]);
            prev.indexes = [...merged];
            if (!prev.bars && row.bars) {
              prev.bars = row.bars;
              prev.analysis = row.analysis;
              prev.error = row.error;
            }
          }
        }
        const fallback = json ? null : await fetchPackJson(`${d}.json`);
        if (fallback) {
          json = fallback;
          for (const r of fallback.results || []) {
            if (!bySym.has(r.symbol)) bySym.set(r.symbol, mapPackRow(r, fallback));
          }
        }
        if (!json && !bySym.size) throw new Error("找不到該日 Chartpack");
        json = json || { date: d, results: [] };
        json.results = [...bySym.values()];
      } else {
        const files = [`${state.index}-${d}.json`, `${d}.json`];
        for (const f of files) {
          json = await fetchPackJson(f);
          if (json) break;
        }
        if (!json) throw new Error("找不到該日 Chartpack");
      }
    } else {
      const res = await fetch(`${LOCAL_BASE}/api/packs/${encodeURIComponent(d)}`);
      json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error || ("HTTP " + res.status));
    }
    state.packDate = json.date || d;
    $("packDate").value = state.packDate;
    if (
      state.index !== "all" &&
      json.index &&
      INDEXES[json.index] &&
      !(Array.isArray(json.indexes) && json.indexes.length > 1)
    ) {
      state.index = json.index;
      syncIndexUi();
    }
    state.results = (json.results || []).map(r => mapPackRow(r, json));
    state.selected = filteredResults().find(r => r.bars)?.symbol
      || state.results.find(r => r.bars)?.symbol || null;
    state.cache = {};
    renderList();
    updatePackButton();
    await refreshSavedPacks(state.packDate);
    const ok = state.results.filter(r => r.bars).length;
    if (ok) {
      setView("pack");
      setStatusText(`已開啟 ${state.packDate} · ${ok} 檔`);
    } else {
      setView("empty");
      setStatusText(`${state.packDate} — 檔案無可用圖表`);
    }
    return true;
  } catch (e) {
    setStatusText(`開啟失敗：${e.message || e}`);
    return false;
  }
}

/** 用快取資料依日期重算（無需重抓）；若無快取則嘗試開啟已存 */
async function rebuildForDate(dateStr) {
  state.packDate = dateStr;
  const syms = Object.keys(state.cache);
  if (!syms.length) {
    const dates = await refreshSavedPacks();
    if (dates.includes(dateStr)) {
      await openPack(dateStr);
    } else {
      setStatusText(ON_PAGES
        ? `沒有 ${dateStr} 的 Chartpack`
        : `已選 ${dateStr} — 點「掃描」或從「已存」開啟`);
    }
    return;
  }
  const prevIdx = {};
  for (const r of state.results) {
    if (r.indexes?.length) prevIdx[r.symbol] = r.indexes;
  }
  state.results = [];
  state.selected = null;
  setStatusText(`重算 ${dateStr} Chartpack…`);
  for (const sym of syms) {
    try {
      const row = analyzeRow(sym, state.cache[sym], dateStr);
      if (prevIdx[sym]) row.indexes = prevIdx[sym];
      state.results.push(row);
    } catch (e) {
      state.results.push({ symbol: sym, error: String(e.message || e), indexes: prevIdx[sym] });
    }
  }
  renderList({ animate: true });
  updatePackButton();
  if (state.results.some(r => r.bars)) {
    setView("pack");
    setStatusText(`${dateStr} Chartpack · ${state.results.filter(r => r.bars).length} 檔（未保存）`);
  } else {
    setView("empty");
    setStatusText(`${dateStr} — 無可用資料`);
  }
}

async function runScan() {
  state.stop = false;
  state.results = [];
  state.selected = null;
  state.cache = {};
  document.body.classList.add("is-scanning");
  $("btnScan").disabled = true;
  $("btnScan").classList.add("is-busy");
  $("btnStop").disabled = false;
  $("btnPack").disabled = true;
  $("btnSingle").disabled = true;
  setIndexChipsDisabled(true);
  $("resultList").innerHTML = "";
  $("packView").innerHTML = "";
  showPane("emptyHint");
  setViewerTitle("掃描中", "分析 NDX100 · DJI30 · CRYPTO30 日線…");
  if ($("listCount")) {
    $("listCount").textContent = "掃描中…";
    replayAnim($("listCount"), "is-swap");
  }

  const dateStr = $("packDate").value || todayISO();
  state.packDate = dateStr;
  $("packDate").value = dateStr;

  setStatusText("取得全部成分股…");
  let membership;
  try {
    membership = await fetchAllUniverseSymbols();
  } catch (_) {
    membership = new Map();
    for (const key of Object.keys(INDEXES)) {
      for (const s of INDEXES[key].fallback) {
        if (!membership.has(s)) membership.set(s, []);
        if (!membership.get(s).includes(key)) membership.get(s).push(key);
      }
    }
  }
  state.symbols = [...membership.keys()];

  const total = state.symbols.length;
  let done = 0;
  setProgress(0, total);

  for (const sym of state.symbols) {
    if (state.stop) break;
    setStatusText(`分析 ${sym} · ${dateStr}…`, { animate: false });
    try {
      const full = await fetchDailyBars(sym);
      state.cache[sym] = full;
      const row = analyzeRow(sym, full, dateStr);
      row.indexes = membership.get(sym) || [state.index];
      state.results.push(row);
      // 掃描中先顯示單圖，完成後切 Chartpack
      if (!state.selected) {
        state.selected = sym;
        showSingle(row);
        setView("single");
      }
    } catch (e) {
      state.results.push({
        symbol: sym,
        error: String(e.message || e),
        indexes: membership.get(sym) || [state.index]
      });
    }
    done++;
    setProgress(done, total);
    renderList();
    await new Promise(r => setTimeout(r, 120));
  }

  document.body.classList.remove("is-scanning");
  $("btnScan").disabled = false;
  $("btnScan").classList.remove("is-busy");
  $("btnStop").disabled = true;
  setIndexChipsDisabled(false);
  updatePackButton();
  const ok = state.results.filter(r => r.bars).length;
  if (ok) {
    setView("pack");
    const saved = await savePack(dateStr);
    if (!saved) {
      setStatusText(state.stop
        ? `已停止 — ${dateStr} · ${done}/${total}（未保存）`
        : `完成 — ${dateStr} · ${ok} 檔（保存失敗，可點「保存」重試）`);
    }
  } else {
    setView("empty");
    setStatusText(state.stop
      ? `已停止 — ${dateStr} · ${done}/${total}`
      : `完成 — ${dateStr} · 無可用圖表`);
  }
}

$("packDate").value = todayISO();
$("packDate").max = todayISO();
$("filterIndexAll").onclick = () => selectIndex("all");

$("btnSingle").onclick = () => {

$("filterBreakout").onclick = () => {

$("filterReclaim").onclick = () => {
  state.filters.reclaim = !state.filters.reclaim;
  applyFilters({ popKey: "reclaim" });

$("filterTouch").onclick = () => {
  state.filters.touch = !state.filters.touch;
  applyFilters({ popKey: "touch" });
};
$("filterPast").onclick = () => {
  state.filters.past = !state.filters.past;
  applyFilters({ popKey: "past" });
