<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NDX100 日線掃描器 · 趨勢線 / Creek / Ice</title>
<meta name="description" content="NDX100 / DJI30 成分股日線四點成線掃描器：向上／向下趨勢線、Creek、Ice 與平行通道，附逐日 Chartpack。" />
<meta name="theme-color" content="#161618" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NDX 掃描" />
<meta name="format-detection" content="telephone=no" />
<script>if (/\.github\.io$/i.test(location.hostname)) document.documentElement.classList.add("is-pages");</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     NDX100 Scanner — data terminal
     平面深色、單一藍色強調（只做 1px 選取線）、數字等寬
     ============================================================ */
  :root {
    --ground: #161618;
    --surface: #101114;
    --surface-2: #17181c;
    --raised: #1e2025;
    --line: #282a30;
    --line-strong: #3c3f47;
    --rule: #202227;
    --text: #f4f5f7;
    --muted: #a2a6ae;
    --dim: #7d828c;
    --accent: #6ba6e8;
    --accent-line: #4a8ad6;
    --pos: #4faf8d;
    --neg: #e5647c;
    --warn: #d9a441;
    --ice: #8ab4d9;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Public Sans", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    --r: 10px;
    --r-sm: 6px;
    --dur: 0.18s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--ground);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  ::selection { background: rgba(74, 138, 214, 0.35); color: #fff; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: #2e3138;
    border: 3px solid var(--surface);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: #3c4048; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .app {
    height: 100dvh;
    min-width: 0;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--ground);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 30px;
    height: 30px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding: 0 6px;
    flex-shrink: 0;
  }
  .brand-mark span {
    display: block;
    height: 1px;
    background: var(--muted);
  }
  .brand-mark span:nth-child(1) { width: 100%; background: var(--accent); }
  .brand-mark span:nth-child(2) { width: 68%; }
  .brand-mark span:nth-child(3) { width: 84%; }
  .brand-text h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.2;
    white-space: nowrap;
  }
  .brand-text h1 span { color: var(--muted); font-weight: 400; }
  .brand-text p {
    font-size: 11.5px;
    color: var(--dim);
    line-height: 1.3;
    margin-top: 1px;
    white-space: nowrap;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    min-width: 0;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 1px 6px 2px;
    min-width: 0;
  }
  .field > span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    line-height: 1.4;
  }
  .field input[type="date"],
  .field select {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 0;
    outline: none;
    padding: 1px 0;
    color-scheme: dark;
    cursor: pointer;
  }
  .field input[type="date"] { min-width: 126px; }
  .field select { min-width: 112px; max-width: 150px; }

  button {
    appearance: none;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur) ease,
      border-color var(--dur) ease,
      color var(--dur) ease,
      opacity var(--dur) ease;
  }
  button:hover:not(:disabled) { background: var(--raised); border-color: #4b4f58; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.34; cursor: not-allowed; }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  button.primary {
    border-color: var(--accent-line);
    color: var(--accent);
    background: rgba(74, 138, 214, 0.1);
  }
  button.primary:hover:not(:disabled) {
    background: rgba(74, 138, 214, 0.18);
    border-color: var(--accent);
  }
  button.ghost-danger:hover:not(:disabled) {
    color: var(--neg);
    border-color: var(--neg);
    background: transparent;
  }
  button.is-busy { pointer-events: none; opacity: 0.6; }
  button.line-mode.active {
    border-color: var(--accent-line);
    color: var(--accent);
    background: rgba(74, 138, 214, 0.1);
  }

  /* ---------- Status strip ---------- */
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 20px;
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  body.is-scanning .status-dot {
    background: var(--accent);
    animation: pulseDot 1.2s ease-in-out infinite;
  }
  #statusText {
    flex: 0 1 auto;
    min-width: 190px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress {
    flex: 1 1 auto;
    min-width: 120px;
    height: 3px;
    background: var(--rule);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    width: 0%;
    height: 100%;
    background: var(--accent-line);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  #statusCount {
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-width: 54px;
    text-align: right;
  }

  /* ---------- Main ---------- */
  main {
    display: grid;
    grid-template-columns: 284px minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  .sidebar-head {
    flex-shrink: 0;
    padding: 14px 16px 11px;
    border-bottom: 1px solid var(--rule);
  }
  .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-head h2 {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #listCount {
    font-family: var(--mono);
    font-style: normal;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .filter-bar {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    margin-top: 13px;
  }
  .filter-bar-label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.06em;
  }
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 4px;
    width: 100%;
    min-width: 0;
  }
  .filter-chip {
    position: relative;
    height: 26px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .filter-chip:hover:not(:disabled) {
    background: var(--raised);
    border-color: transparent;
    color: var(--text);
  }
  .filter-chip.active { color: var(--text); }
  .filter-chip.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 2px;
    height: 1px;
    background: var(--accent-line);
  }
  .filter-meta {
    display: block;
    margin-top: 9px;
    font-size: 11.5px;
    color: var(--dim);
    line-height: 1.45;
  }
  .filter-meta strong {
    color: var(--text);
    font-weight: 500;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 7px 16px;
    border-bottom: 1px solid var(--rule);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #resultList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #resultList:empty::before {
    content: "尚無結果";
    display: block;
    padding: 18px 16px;
    font-size: 12px;
    color: var(--dim);
  }
  .list-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 42px;
    padding: 0 16px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    outline: none;
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .list-item:hover,
  .list-item:focus-visible { background: var(--surface-2); color: var(--text); }
  .list-item.active { background: var(--surface-2); color: var(--text); }
  .list-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--accent-line);
  }
  .list-item.err { opacity: 0.55; }
  .list-item .sym { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .list-item .tags {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--dim);
  }
  .tag { white-space: nowrap; }
  .tag.is-break { color: var(--warn); }
  .tag.is-reclaim { color: var(--pos); }
  .tag.is-touch { color: var(--ice); }
  .tag.is-err { color: var(--dim); }

  /* ---------- Viewer ---------- */
  .viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 22px 26px;
    background: var(--ground);
  }
  .viewer-toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
    padding-bottom: 11px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .title-block { min-width: 0; }
  .title-block h2 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--text);
  }
  .title-block p {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .seg { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .seg button {
    position: relative;
    height: 28px;
    padding: 0 1px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
  }
  .seg button:hover:not(:disabled) { background: transparent; color: var(--text); }
  .seg button.active { color: var(--text); background: transparent; }
  .seg button.active::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: -12px;
    height: 1px;
    background: var(--accent-line);
  }

  .viewer-stage { position: relative; min-height: 320px; }
  .view-pane {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  .view-pane.is-on {
    position: relative;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: none;
  }
  .view-pane.is-exit {
    opacity: 0;
    transform: translateY(-4px);
    visibility: hidden;
  }

  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px 10px;
    overflow: hidden;
  }
  .chart-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .chart-wrap.is-panning,
  .chart-wrap.is-panning canvas { cursor: grabbing; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 22px;
    margin-top: 8px;
    padding: 11px 4px 2px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
  }
  .lg { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
  .lg::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dot, var(--dim));
    flex-shrink: 0;
  }
  .lg b { font-weight: 600; color: var(--text); white-space: nowrap; }
  .lg em {
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  .c-up { --dot: var(--pos); }
  .c-down { --dot: var(--neg); }
  .c-creek { --dot: var(--warn); }
  .c-ice { --dot: var(--ice); }
  .c-accent { --dot: var(--accent); }

  /* ---------- Chartpack grid ---------- */
  .pack-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
    gap: 16px;
  }
  .pack-card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
    cursor: pointer;
    outline: none;
    transition: border-color var(--dur) ease, background var(--dur) ease;
  }
  .pack-card:hover,
  .pack-card:focus-visible {
    border-color: var(--line-strong);
    background: var(--surface-2);
  }
  .pack-card header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .pack-card header .pack-date {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--dim);
    letter-spacing: 0.03em;
  }
  .pack-card header .tags {
    display: flex;
    gap: 8px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--dim);
  }
  .pack-card canvas { display: block; width: 100%; height: auto; }
  .pack-card .info {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 16px;
    padding: 9px 14px 11px;
    border-top: 1px solid var(--rule);
    font-size: 11.5px;
    color: var(--muted);
  }
  .pack-card .info .lg b { font-size: 11.5px; }

  /* ---------- Empty ---------- */
  .empty {
    max-width: 520px;
    margin: 5vh auto 0;
    padding: 28px 28px 30px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
  }
  .empty-ico {
    position: relative;
    width: 40px;
    height: 32px;
    margin-bottom: 18px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
  }
  .empty-ico::before {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 9px;
    height: 1px;
    background: var(--muted);
    box-shadow: 0 5px 0 var(--line-strong), 0 10px 0 var(--line);
  }
  .empty h3 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .empty p {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--muted);
  }
  .empty code {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    white-space: nowrap;
  }

  /* ---------- Motion (subtle only) ---------- */
  .is-swap { animation: fadeSwap 0.2s ease both; }
  .filter-chip.is-pop,
  .seg button.is-pop { animation: fadeSwap 0.2s ease both; }
  #resultList.is-swap { animation: fadeSwap 0.2s ease both; }
  .pack-card { animation: fadeSwap 0.24s ease both; }

  @keyframes fadeSwap {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  html.is-pages .pages-hide,
  body.is-pages .pages-hide { display: none !important; }
  html.is-pages .tool-group[aria-label="掃描"],
  body.is-pages .tool-group[aria-label="掃描"] {
    border: 0;
    background: transparent;
    padding-right: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1220px) {
    main { grid-template-columns: 248px minmax(0, 1fr); }
    .brand-text p { display: none; }
    .viewer { padding: 14px 16px 22px; }
  }
  @media (max-width: 980px) {
    .app {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .topbar {
      flex-wrap: wrap;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    }
    .toolbar { width: 100%; justify-content: flex-start; }
    .tool-group { flex-wrap: wrap; }
    .status {
      display: grid;
      grid-template-columns: 5px minmax(0, 1fr) auto;
      align-items: center;
      gap: 4px 10px;
      padding: 8px 14px;
    }
    .status-dot { grid-column: 1; }
    #statusText {
      grid-column: 2 / 4;
      min-width: 0;
      white-space: normal;
    }
    .progress { grid-column: 1 / 3; min-width: 0; }
    #statusCount { grid-column: 3; grid-row: 2; text-align: right; }
    main {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
    }
    .sidebar {
      order: 0;
      max-height: none;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .viewer {
      order: 1;
      min-height: 0;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .viewer-stage { min-height: 240px; flex: 1; }
    .pack-grid { grid-template-columns: minmax(0, 1fr); }
    .title-block h2 { font-size: 17px; }

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-text">
        <h1>NDX100 <span>掃描器</span></h1>
        <p>日線 · 四點成線 · 趨勢線 / Creek / Ice</p>
      </div>
    </div>
    <div class="toolbar">
      <div class="tool-group" aria-label="存檔">

        </label>
        <label class="field pages-hide"><span>已存</span>

  <main>

            <button type="button" class="filter-chip" id="filterReclaim" data-filter="reclaim" aria-pressed="false" title="近 5 根先實體跌破，之後有一根實體完全回到線內">收回</button>
            <button type="button" class="filter-chip" id="filterTouch" data-filter="touch" aria-pressed="false">觸碰</button>

        </div>

            <div class="legend" id="mainLegend"></div>

<script>
/* ========== 成分股 fallback ========== */
const NDX100_FALLBACK = [
  "AAPL","ABNB","ADBE","ADI","ADP","ADSK","AEP","ALAB","ALNY","AMAT","AMD","AMGN","AMZN","APP",
  "ARM","ASML","AVGO","AXON","BKR","BKNG","CCEP","CDNS","CEG","CMCSA","COST","CPRT","CRWD","CRWV",
  "CSCO","CSX","CTAS","DASH","DDOG","DXCM","EXC","FANG","FAST","FER","FTNT","GEHC","GILD","GOOG",
  "GOOGL","HON","HONA","IDXX","INTC","INTU","ISRG","KDP","KLAC","LIN","LITE","LRCX","MAR","MCHP",
  "MDLZ","MELI","META","MNST","MPWR","MRNA","MRVL","MSFT","MSTR","MU","NBIS","NFLX","NVDA","NXPI",
  "ODFL","ORLY","PANW","PAYX","PCAR","PDD","PEP","PLTR","PYPL","QCOM","REGN","RKLB","ROP","ROST",
  "SBUX","SHOP","SNDK","SNPS","STX","TER","TMUS","TRI","TSLA","TTWO","TXN","VRTX","WDAY","WDC",
  "WMT","XEL"
];

/** 道瓊 30（2025-11 · NVDA 取代 INTC、AMZN 取代 WBA） */
const DJI30_FALLBACK = [
  "AAPL","AMGN","AMZN","AXP","BA","CAT","CRM","CSCO","CVX","DIS",
  "DOW","GS","HD","HON","IBM","JNJ","JPM","KO","MCD","MMM",
  "MRK","MSFT","NKE","NVDA","PG","TRV","UNH","V","VZ","WMT"
];

const INDEXES = {
  ndx100: {
    label: "NDX100",
    fallback: NDX100_FALLBACK,
    apiPath: "/api/ndx100",
    minRows: 50
  },
  dji30: {
    label: "DJI30",
    fallback: DJI30_FALLBACK,
    apiPath: "/api/dji30",
    minRows: 25
  }
};

const CFG = {
  pivotLeft: 3,
  pivotRight: 3,
  touchTolPct: 0.0045,       // 0.45% of price
  touchMergeBars: 5,         // 相鄰 ≤5 根內的觸點合併為 1
  maxTouchGapBars: 120,      // 相鄰觸點間隔不得超過 120 根 K
  recentTouchBars: 60,       // 至少一觸點須落在最新 60 根內
  maxBodyBreaks: 3,          // 成形後實體穿越最多 3 根
  maxWickBreaks: 5,          // 成形後引線穿越最多 5 根
  horizSlopePct: 0.015,      // |m|*bars / midPrice < 1.5% → near horizontal
  minTouches: 4,
  windows: [200, 300, 400, 500, 600, 800, 1000], // 做線視窗（由小到大）
  lineIgnoreLastBars: 10, // 「忽略最新10根」另算線時略過的根數
  chartWindow: 600, // 圖表固定顯示根數
  chartRightPadBars: 20, // 視窗右緣預留空白（根）
  colors: {
    bg: "#0e0f12",
    grid: "#20232a",
    text: "#a2a6ae",
    textStrong: "#f4f5f7",
    up: "#4faf8d",
    down: "#e5647c",
    tlUp: "#4faf8d",
    tlDown: "#e5647c",
    creek: "#d9a441",
    ice: "#8ab4d9",
    wick: "#8b909a",
    accent: "#6ba6e8"
  }
};

/* ========== State ========== */
const state = {
  index: "ndx100",
  symbols: [...NDX100_FALLBACK],
  results: [],
  cache: {},          // symbol → 完整日線（未截斷）
  selected: null,
  stop: false,
  packDate: "",
  view: "single",
  filters: { breakout: false, reclaim: false, touch: false },
  ignoreLast10: false,
  chartSymbol: null,
  chartView: null
};

function currentIndexConfig() {
  return INDEXES[state.index] || INDEXES.ndx100;
}

function syncIndexUi() {
  const cfg = currentIndexConfig();
  const h1 = document.querySelector(".brand-text h1");
  if (h1) h1.innerHTML = `${cfg.label} <span>掃描器</span>`;
  document.title = `${cfg.label} 日線掃描器 · 趨勢線 / Creek / Ice`;
  const sel = $("indexSelect");
  if (sel && sel.value !== state.index) sel.value = state.index;
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/** 截斷至選定日期當日收盤（含） */
function barsAsOf(bars, dateStr) {
  if (!dateStr || !bars?.length) return bars || [];
  const end = new Date(dateStr + "T23:59:59").getTime();
  return bars.filter(b => b.t <= end);
}

/* ========== Data fetch (prefer local server.py proxy) ========== */
const ON_PAGES = /\.github\.io$/i.test(location.hostname);
if (ON_PAGES) {
  document.documentElement.classList.add("is-pages");
  document.body.classList.add("is-pages");
}
const LOCAL_BASE = (() => {
  const { hostname } = location;
  if (hostname === "127.0.0.1" || hostname === "localhost") return "";
  if (ON_PAGES) return "";
  return "http://127.0.0.1:8765";
})();

function packAsset(file) {
  const path = location.pathname.endsWith("/")
    ? location.pathname
    : location.pathname.replace(/[^/]*$/, "");
  return `${location.origin}${path}chartpacks/${encodeURIComponent(file)}`;
}

function medianGapDays(bars) {
  if (!bars || bars.length < 3) return Infinity;
  const gaps = [];
  for (let i = 1; i < bars.length; i++) {
    gaps.push((bars[i].t - bars[i - 1].t) / 86400000);
  }
  gaps.sort((a, b) => a - b);
  return gaps[Math.floor(gaps.length / 2)];
}

/** Yahoo range=max 常降採樣成週/月/季；只接受近似日線 */
function isDailyBars(bars, metaGran) {
  if (metaGran && metaGran !== "1d") return false;
  return medianGapDays(bars) <= 5;
}

function parseYahooBars(json) {
  const r = json?.chart?.result?.[0];
  if (!r) throw new Error("no result");
  const gran = r.meta?.dataGranularity;
  const ts = r.timestamp || [];
  const q = r.indicators?.quote?.[0] || {};
  const bars = [];
  for (let i = 0; i < ts.length; i++) {
    const o = q.open?.[i], h = q.high?.[i], l = q.low?.[i], c = q.close?.[i];
    const v = q.volume?.[i];
    if ([o, h, l, c].some(x => x == null || Number.isNaN(x))) continue;
    bars.push({
      t: ts[i] * 1000,
      o: +o, h: +h, l: +l, c: +c,
      v: v == null ? 0 : +v
    });
  }
  if (bars.length < 50) throw new Error("too few bars");
  if (!isDailyBars(bars, gran)) {
    throw new Error(`非日線資料（gran=${gran || "?"} gap≈${medianGapDays(bars).toFixed(1)}d）`);
  }
  return bars;
}

async function fetchIndexSymbols() {
  const cfg = currentIndexConfig();
  const urls =
    state.index === "ndx100"
      ? [
          `${LOCAL_BASE}${cfg.apiPath}`,
          "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://api.nasdaq.com/api/quote/list-type/nasdaq100"),
          "https://corsproxy.io/?" + encodeURIComponent("https://api.nasdaq.com/api/quote/list-type/nasdaq100")
        ]
      : [`${LOCAL_BASE}${cfg.apiPath}`];

  for (const url of urls) {
    try {
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok) continue;
      const json = await res.json();
      if (state.index === "dji30") {
        const syms = json?.symbols;
        if (Array.isArray(syms) && syms.length >= cfg.minRows) {
          return syms.map(s => String(s).toUpperCase()).filter(Boolean).sort();
        }
        continue;
      }
      const rows = json?.data?.data?.rows;
      if (Array.isArray(rows) && rows.length >= cfg.minRows) {
        return rows.map(r => r.symbol).filter(Boolean).sort();
      }
    } catch (_) { /* try next */ }
  }
  return [...cfg.fallback];
}

async function fetchDailyBars(symbol) {
  // 勿用 range=max：Yahoo 會改成週/月/季線。10y/5y 可維持 interval=1d。
  const ranges = ["10y", "5y"];
  let lastErr = null;
  for (const range of ranges) {
    const urls = [
      `${LOCAL_BASE}/api/chart?symbol=${encodeURIComponent(symbol)}&range=${range}`,
      "https://corsproxy.io/?" + encodeURIComponent(
        `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=${range}&includePrePost=false`
      )
    ];
    for (const url of urls) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (json?.error) throw new Error(json.error);
        return parseYahooBars(json);
      } catch (e) {
        lastErr = e;
      }
    }
  }
  throw lastErr || new Error("fetch failed");
}

/* ========== Pivots ========== */
function findPivots(bars, left, right) {
  const highs = [];
  const lows = [];
  const n = bars.length;
  for (let i = left; i < n - right; i++) {
    let isH = true, isL = true;
    for (let j = i - left; j <= i + right; j++) {
      if (j === i) continue;
      if (bars[j].h >= bars[i].h) isH = false;
      if (bars[j].l <= bars[i].l) isL = false;
    }
    if (isH) highs.push(i);
    if (isL) lows.push(i);
  }
  return { highs, lows };
}

function lineThrough(i1, p1, i2, p2) {
  const m = (p2 - p1) / (i2 - i1);
  const b = p1 - m * i1;
  return { m, b };
}
function yAt(line, i) { return line.m * i + line.b; }

function bodyTop(bar) { return Math.max(bar.o, bar.c); }
function bodyBot(bar) { return Math.min(bar.o, bar.c); }

function lineTol(lp) {
  return Math.max(Math.abs(lp) * CFG.touchTolPct, 1e-9);
}

function isTouchBar(bar, lp, resistance) {
  const wick = resistance ? bar.h : bar.l;
  return Math.abs(wick - lp) <= lineTol(lp);
}

function bodyFullCross(bar, lp, resistance) {
  return resistance ? bodyBot(bar) > lp : bodyTop(bar) < lp;
}

function wickOnlyCross(bar, lp, resistance) {
  if (bodyFullCross(bar, lp, resistance)) return false;
  return resistance
    ? bar.h > lp && bodyTop(bar) <= lp
    : bar.l < lp && bodyBot(bar) >= lp;
}

/** 整根實體在持有側：支撐實體完全在線上、壓力實體完全在線下 */
function bodyFullyHeld(bar, lp, resistance) {
  return resistance ? bodyTop(bar) < lp : bodyBot(bar) > lp;
}

function mergeTouchIndices(indices) {
  if (!indices.length) return [];
  const clusters = [[indices[0]]];
  for (let k = 1; k < indices.length; k++) {
    const i = indices[k];
    if (i - clusters[clusters.length - 1][clusters[clusters.length - 1].length - 1] <= CFG.touchMergeBars) {
      clusters[clusters.length - 1].push(i);
    } else {
      clusters.push([i]);
    }
  }
  return clusters.map(cl => cl[0]);
}

function longestTouchSegment(indices) {
  const merged = mergeTouchIndices(indices);
  if (!merged.length) return [];
  const segs = [[merged[0]]];
  for (let k = 1; k < merged.length; k++) {
    const i = merged[k];
    const last = segs[segs.length - 1];
    if (i - last[last.length - 1] > CFG.maxTouchGapBars) segs.push([i]);
    else last.push(i);
  }
  segs.sort((a, b) => (b.length - a.length) || ((b[b.length - 1] - b[0]) - (a[a.length - 1] - a[0])));
  return segs[0];
}

function collectRawTouches(bars, line, resistance, startI, endI) {
  const hits = [];
  for (let i = startI; i <= endI; i++) {
    if (isTouchBar(bars[i], yAt(line, i), resistance)) hits.push(i);
  }
  return hits;
}

function pierceCounts(bars, line, resistance, startI, endI) {
  let bodyN = 0, wickN = 0;
  for (let i = startI; i <= endI; i++) {
    const lp = yAt(line, i);
    const bar = bars[i];
    if (bodyFullCross(bar, lp, resistance)) bodyN++;
    else if (wickOnlyCross(bar, lp, resistance)) wickN++;
  }
  return { bodyBreaks: bodyN, wickBreaks: wickN };
}

function lineScore(L) {
  return [L.touches.length, L._span || 0, -L.touches[0]];
}

function betterLine(a, b) {
  const sa = lineScore(a), sb = lineScore(b);
  for (let i = 0; i < sa.length; i++) {
    if (sa[i] !== sb[i]) return sa[i] > sb[i];
  }
  return false;
}

function packLine(bars, line, kind, touches, bodyN, wickN, lookback, horizontal) {
  const n = bars.length;
  const firstI = touches[0];
  const lastTouch = touches[touches.length - 1];
  const span = lastTouch - firstI;
  let type, label;
  if (horizontal) {
    type = kind === "support" ? "creek" : "ice";
    label = kind === "support" ? "Creek" : "Ice";
  } else {
    type = kind === "support" ? "uptrend" : "downtrend";
    label = kind === "support" ? "向上趨勢線" : "向下趨勢線";
  }
  return {
    kind,
    line,
    touches,
    bodyBreaks: bodyN,
    wickBreaks: wickN,
    start: Math.max(0, n - lookback),
    drawFrom: firstI,
    drawTo: n - 1,
    windowSize: lookback,
    score: touches.length * 10 + span * 0.01,
    _span: span,
    label,
    type
  };
}

function evaluateCandidate(bars, line, kind, winLo, lookback) {
  const n = bars.length;
  const lastI = n - 1;
  const resistance = kind === "resistance";
  const raw = collectRawTouches(bars, line, resistance, winLo, lastI);
  const seg = longestTouchSegment(raw);
  if (seg.length < CFG.minTouches) return null;
  const recentLo = lastI - (CFG.recentTouchBars - 1);
  if (!seg.some(i => i >= recentLo)) return null;
  const firstI = seg[0];
  const br = pierceCounts(bars, line, resistance, firstI + 1, lastI);
  if (br.bodyBreaks > CFG.maxBodyBreaks || br.wickBreaks > CFG.maxWickBreaks) return null;
  let outLine = { ...line };
  let horizontal = false;
  const span = seg[seg.length - 1] - firstI;
  const p0 = yAt(line, firstI);
  const maxWin = CFG.windows[CFG.windows.length - 1];
  if (lookback >= maxWin && p0) {
    const drift = Math.abs(line.m) * span / Math.abs(p0);
    if (drift < CFG.horizSlopePct) {
      const level = seg.reduce((s, i) => s + yAt(line, i), 0) / seg.length;
      outLine = { m: 0, b: level };
      horizontal = true;
    }
  }
  return packLine(bars, outLine, kind, seg, br.bodyBreaks, br.wickBreaks, lookback, horizontal);
}

function pivotsInLookback(bars, lookback) {
  const startIdx = Math.max(0, bars.length - lookback);
  const slice = bars.slice(startIdx);
  const { highs, lows } = findPivots(slice, CFG.pivotLeft, CFG.pivotRight);
  return {
    highs: highs.map(i => i + startIdx),
    lows: lows.map(i => i + startIdx)
  };
}

function collectSideLine(bars, lookback, kind) {
  const n = bars.length;
  const actual = Math.min(lookback, n);
  const winLo = n - actual;
  const { highs, lows } = pivotsInLookback(bars, actual);
  const pts = kind === "support" ? lows : highs;
  let best = null;
  for (let a = 0; a < pts.length; a++) {
    for (let c = a + 1; c < pts.length; c++) {
      const i1 = pts[a], i2 = pts[c];
      if (i2 - i1 < 5) continue;
      const p1 = kind === "support" ? bars[i1].l : bars[i1].h;
      const p2 = kind === "support" ? bars[i2].l : bars[i2].h;
      if (kind === "support" && p2 < p1) continue;
      if (kind === "resistance" && p2 > p1) continue;
      const line = lineThrough(i1, p1, i2, p2);
      const cand = evaluateCandidate(bars, line, kind, winLo, actual);
      if (!cand) continue;
      if (!best || betterLine(cand, best)) best = cand;
    }
  }
  return best;
}

function lineFitBars(bars, skip) {
  skip = skip | 0;
  if (skip <= 0) return bars;
  const cut = bars.length - skip;
  if (cut < 80) return bars;
  return bars.slice(0, cut);
}

function analyzeSymbol(bars, mode, skipLast = 0) {
  const fit = lineFitBars(bars, skipLast);
  const windows = mode === "auto"
    ? CFG.windows
    : [parseInt(mode, 10)].filter(Boolean);

  const found = {};
  for (const kind of ["support", "resistance"]) {
    for (const lookback of windows) {
      const actual = Math.min(lookback, fit.length);
      if (actual < 80 && lookback >= 80) continue;
      const line = collectSideLine(fit, actual, kind);
      if (line) {
        found[kind] = line;
        break;
      }
      if (actual >= fit.length) break;
    }
  }

  const up = found.support || null;
  const down = found.resistance || null;
  let usedWindow = null;
  for (const L of [up, down]) {
    if (L?.windowSize) usedWindow = usedWindow == null ? L.windowSize : Math.max(usedWindow, L.windowSize);
  }

  let channel = null;
  const primary = up && !down ? up : (!up && down ? down : null);
  if (primary) channel = makeParallelChannel(primary, fit);

  return { up, down, channel, window: usedWindow, bars };
}

/**
 * 單邊才找平行通道：同斜率、對側樞軸錨點，四點／實體破≤3／引線破≤5。
 */
function makeParallelChannel(L, bars) {
  if (!L?.touches?.length) return null;
  const n = bars.length;
  const lookback = L.windowSize || n;
  const winLo = Math.max(0, n - lookback);
  const i0 = L.drawFrom ?? L.touches[0];
  if (i0 >= n - 1) return null;

  const oppKind = L.kind === "support" ? "resistance" : "support";
  const { highs, lows } = pivotsInLookback(bars, lookback);
  const pts = oppKind === "support" ? lows : highs;
  const m = L.line.m;
  let best = null;

  for (const i of pts) {
    const srcY = yAt(L.line, i);
    const price = oppKind === "support" ? bars[i].l : bars[i].h;
    if (oppKind === "resistance" && price < srcY) continue;
    if (oppKind === "support" && price > srcY) continue;
    const cand = evaluateCandidate(bars, { m, b: price - m * i }, oppKind, winLo, lookback);
    if (!cand) continue;
    if (!best || betterLine(cand, best)) best = cand;
  }
  if (!best) return null;
  best.type = "channel";
  best.label = "平行通道";
  best.isParallel = true;
  best.pairOf = L.type;
  best.drawFrom = Math.min(i0, best.touches[0]);
  best.drawTo = n - 1;
  return best;
}

/* ========== Chart drawing ========== */
const FONT_MONO = '"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace';
const FONT_SANS = '"Public Sans", "Noto Sans TC", system-ui, sans-serif';

function fmtPrice(p) {
  if (!Number.isFinite(p)) return "—";
  if (Math.abs(p) >= 1000) return p.toLocaleString("en-US", { maximumFractionDigits: 0 });
  if (Math.abs(p) >= 100) return p.toFixed(1);
  return p.toFixed(2);
}

function fmtDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function lineColorOf(L, c) {
  if (L.type === "channel") return c.accent;
  if (L.type === "creek") return c.creek;
  if (L.type === "ice") return c.ice;
  if (L.type === "uptrend") return c.tlUp;
  return c.tlDown;
}

function lineNameOf(L) {
  if (L.type === "channel") return "通道";
  if (L.type === "creek") return "Creek";
  if (L.type === "ice") return "Ice";
  if (L.type === "uptrend") return "趨勢線↑";
  return "趨勢線↓";
}

/**
 * Draw one daily chart on a canvas, sized from its rendered width.
 * opts: { date, compact, window }
 */
/** Chartpack 若只存最後 N 根，觸點索引仍可能是完整序列；平移到目前 bars。 */
function rebaseAnalysis(analysis, nBars) {
  if (!analysis || !nBars) return analysis;
  const lines = [analysis.up, analysis.down, analysis.channel].filter(Boolean);
  if (!lines.length) return analysis;
  const idxs = [];
  for (const L of lines) {
    for (const v of [L.drawFrom, L.drawTo, L.start, ...(L.touches || [])]) {
      if (v != null) idxs.push(v);
    }
  }
  const maxI = idxs.length ? Math.max(...idxs) : 0;
  if (maxI < nBars) return analysis;
  let nFull = maxI + 1;
  for (const L of lines) {
    if (L.start != null && L.windowSize) nFull = Math.max(nFull, L.start + L.windowSize);
  }
  const offset = nFull - nBars;
  if (offset <= 0) return analysis;
  const shift = (L) => {
    if (!L) return L;
    const line = L.line
      ? { m: L.line.m, b: L.line.b + L.line.m * offset }
      : L.line;
    return {
      ...L,
      line,
      start: L.start != null ? L.start - offset : L.start,
      drawFrom: L.drawFrom != null ? L.drawFrom - offset : L.drawFrom,
      drawTo: L.drawTo != null ? L.drawTo - offset : L.drawTo,
      touches: (L.touches || []).map(i => i - offset).filter(i => i >= 0)
    };
  };
  return {
    ...analysis,
    up: shift(analysis.up),
    down: shift(analysis.down),
    channel: shift(analysis.channel)
  };
}

function drawChart(canvas, bars, analysis, symbol, opts = {}) {
  if (!canvas || !bars || !bars.length) return;
  analysis = rebaseAnalysis(analysis, bars.length);
  const c = CFG.colors;
  const compact = !!opts.compact;

  const cssW = Math.max(
    260,
    Math.round(canvas.clientWidth || canvas.parentElement?.clientWidth || (compact ? 460 : 900))
  );
  const ratio = compact ? (cssW < 520 ? 0.62 : 0.54) : 0.56;
  let cssH = Math.round(cssW * ratio);
  const mobile = window.matchMedia("(max-width: 980px)").matches;
  if (compact) {
    cssH = Math.max(180, cssH);
  } else if (mobile) {
    const cap = Math.round((window.visualViewport?.height || window.innerHeight) * 0.44);
    cssH = Math.max(220, Math.min(cssH, cap));
  } else {
    cssH = Math.max(360, cssH);
  }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(cssW * dpr);
  const bh = Math.round(cssH * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  canvas.style.height = cssH + "px";

  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const total = bars.length;
  const rightPad = compact ? 0 : (CFG.chartRightPadBars | 0);
  const defaultWin = compact ? 260 : (CFG.chartWindow || 600) + rightPad;
  let win = opts.window || defaultWin;
  win = Math.max(1, Math.min(compact ? total : total + rightPad, win));
  let end = opts.end != null ? opts.end : total + rightPad;
  if (compact) end = Math.max(win, Math.min(total, end));
  else end = Math.max(win, Math.min(total + win - 1, end));
  const start = end - win;
  const n = win;
  const visFrom = Math.max(0, start);
  const visTo = Math.min(total, start + n);
  if (visFrom >= visTo) return;

  const pad = compact
    ? { t: 12, r: 54, b: 21, l: 6 }
    : { t: 52, r: 68, b: 34, l: 8 };

  const lineObjs = [analysis?.up, analysis?.down, analysis?.channel].filter(L => L?.line);

  let lo = Infinity;
  let hi = -Infinity;
  for (let i = visFrom; i < visTo; i++) {
    lo = Math.min(lo, bars[i].l);
    hi = Math.max(hi, bars[i].h);
  }
  for (const L of lineObjs) {
    const a = Math.max(visFrom, L.drawFrom ?? L.touches?.[0] ?? visFrom);
    const b = visTo - 1;
    for (let i = a; i <= b; i++) {
      const y = yAt(L.line, i);
      if (Number.isFinite(y)) {
        lo = Math.min(lo, y);
        hi = Math.max(hi, y);
      }
    }
    const yEnd = yAt(L.line, start + n - 0.5);
    if (Number.isFinite(yEnd)) {
      lo = Math.min(lo, yEnd);
      hi = Math.max(hi, yEnd);
    }
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
  if (!compact && opts.yRange && opts.yRange.hi > opts.yRange.lo) {
    lo = opts.yRange.lo;
    hi = opts.yRange.hi;
  } else {
    const span = hi - lo || Math.abs(hi) * 0.02 || 1;
    lo -= span * 0.07;
    hi += span * 0.07;
  }

  const left = pad.l;
  const top = pad.t;
  const pw = cssW - pad.l - pad.r;
  const ph = cssH - pad.t - pad.b;
  const xAt = i => left + ((i + 0.5) / n) * pw;
  const yPx = p => top + ((hi - p) / (hi - lo)) * ph;
  const candleW = Math.max(1.1, Math.min(9, (pw / n) * 0.62));
  const mono = (size, weight = 500) => `${weight} ${size}px ${FONT_MONO}`;
  const sans = (size, weight = 400) => `${weight} ${size}px ${FONT_SANS}`;
  const labelSize = compact ? 9.5 : 10.5;

  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, cssW, cssH);

  /* y grid + price labels (right side) */
  const rows = compact ? 4 : 5;
  for (let g = 0; g <= rows; g++) {
    const y = Math.round(top + (ph * g) / rows) + 0.5;
    ctx.strokeStyle = c.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(left + pw, y);
    ctx.stroke();

    const price = hi - ((hi - lo) * g) / rows;
    ctx.font = mono(compact ? 10 : 11);
    ctx.fillStyle = c.text;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(fmtPrice(price), left + pw + 8, y);
  }

  /* x labels + ticks (with faint vertical guides) */
  const tickCount = compact ? 3 : (cssW < 620 ? 4 : 6);
  ctx.font = mono(compact ? 9.5 : 10.5);
  ctx.textBaseline = "top";
  for (let k = 0; k < tickCount; k++) {
    const slot = Math.round((k / (tickCount - 1)) * (n - 1));
    const di = start + slot;
    if (di < 0 || di >= total) continue;
    const x = Math.round(xAt(slot)) + 0.5;
    ctx.strokeStyle = c.grid;
    ctx.lineWidth = 1;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, top + ph);
    ctx.stroke();
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x, top + ph);
    ctx.lineTo(x, top + ph + 4);
    ctx.stroke();

    ctx.fillStyle = c.text;
    ctx.textAlign = k === 0 ? "left" : k === tickCount - 1 ? "right" : "center";
    ctx.fillText(fmtDate(bars[di].t), x, top + ph + 7);
  }

  /* candles */
  for (let i = visFrom; i < visTo; i++) {
    const b = bars[i];
    const x = Math.round(xAt(i - start)) + 0.5;
    const up = b.c >= b.o;
    const color = up ? c.up : c.down;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yPx(b.h));
    ctx.lineTo(x, yPx(b.l));
    ctx.stroke();

    const y1 = yPx(Math.max(b.o, b.c));
    const y2 = yPx(Math.min(b.o, b.c));
    ctx.fillRect(x - candleW / 2, y1, candleW, Math.max(1, y2 - y1));
  }

  /* trend lines, touches and end labels */
  const labelYs = [];
  for (const L of lineObjs) {
    const color = lineColorOf(L, c);
    const absFrom = L.drawFrom ?? L.touches?.[0] ?? start;
    const iFrom = Math.max(0, absFrom - start);
    if (iFrom > n - 1) continue;
    const xRight = left + pw;
    const iRight = n - 0.5;

    ctx.strokeStyle = color;
    ctx.lineWidth = L.type === "channel" ? 1.25 : 1.75;
    ctx.setLineDash(
      L.type === "channel" ? [4, 4] : (L.type === "creek" || L.type === "ice") ? [7, 4] : []
    );
    ctx.beginPath();
    ctx.moveTo(xAt(iFrom), yPx(yAt(L.line, start + iFrom)));
    ctx.lineTo(xRight, yPx(yAt(L.line, start + iRight)));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = color;
    ctx.strokeStyle = c.bg;
    ctx.lineWidth = 1;
    for (const ti of L.touches || []) {
      if (ti < visFrom || ti >= visTo) continue;
      const px = L.kind === "support" ? bars[ti].l : bars[ti].h;
      ctx.beginPath();
      ctx.arc(xAt(ti - start), yPx(px), compact ? 2 : 2.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    const yEnd = yPx(yAt(L.line, start + iRight));
    if (yEnd >= top + 6 && yEnd <= top + ph - 6) {
      let ly = yEnd - 8;
      while (labelYs.some(v => Math.abs(v - ly) < 13)) ly -= 13;
      labelYs.push(ly);
      const label = `${lineNameOf(L)} ${(L.touches || []).length}`;
      ctx.font = sans(labelSize, 600);
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(14,15,18,0.82)";
      ctx.fillRect(left + pw - tw - 12, ly - 7, tw + 8, 14);
      ctx.fillStyle = color;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(label, left + pw - 6, ly);
    }
  }

  /* close marker：跟隨視窗內最右一根實際 K，不鎖死全序列最新根 */
  const last = bars[visTo - 1];
  const lastY = yPx(last.c);
  ctx.strokeStyle = "rgba(244,245,247,0.28)";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(left, lastY);
  ctx.lineTo(left + pw, lastY);
  ctx.stroke();
  ctx.setLineDash([]);

  const chipW = pad.r - 16;
  const chipH = compact ? 15 : 18;
  ctx.fillStyle = "#1b2430";
  ctx.fillRect(left + pw + 5, lastY - chipH / 2, chipW, chipH);
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(left + pw + 5.5, lastY - chipH / 2);
  ctx.lineTo(left + pw + 5.5, lastY + chipH / 2);
  ctx.stroke();
  ctx.font = mono(compact ? 9 : 10.5, 600);
  ctx.fillStyle = "#dceaf9";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(fmtPrice(last.c), left + pw + 5 + chipW / 2, lastY + 0.5);

  canvas._chartMeta = compact ? null : { left, pw, ph, top, start, n, total, lo, hi };

  /* title */
  if (!compact) {
    const quote = bars[total - 1];
    const dateStr = opts.date || new Date(quote.t).toISOString().slice(0, 10);
    const lineWin = analysis?.window || CFG.windows[0];
    const narrow = cssW < 620;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.font = mono(13, 600);
    ctx.fillStyle = c.textStrong;
    ctx.fillText(symbol, left, 22);
    if (!narrow) {
      const symW = ctx.measureText(symbol).width;
      ctx.font = sans(11.5, 400);
      ctx.fillStyle = c.text;
      ctx.fillText(`日線 · ${dateStr} · 顯示 ${win} 根 · 做線 ${lineWin} 根`, left + symW + 12, 22);
    } else {
      ctx.font = sans(11.5, 400);
      ctx.fillStyle = c.text;
      ctx.fillText(`日線 · ${dateStr} · 顯示 ${win} 根`, left, 40);
    }

    const prev = bars[total - 2] || quote;
    const chg = prev.c ? ((quote.c - prev.c) / prev.c) * 100 : 0;
    ctx.textAlign = "right";
    ctx.font = mono(13, 600);
    ctx.fillStyle = c.textStrong;
    ctx.fillText(fmtPrice(quote.c), left + pw, 22);
    const closeW = ctx.measureText(fmtPrice(quote.c)).width;
    ctx.font = mono(11, 500);
    ctx.fillStyle = chg >= 0 ? c.up : c.down;
    ctx.fillText(`${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%`, left + pw - closeW - 10, 22);
  }
}

function legendHtml(analysis) {
  const parts = [];
  const add = (L) => {
    if (!L) return;
    const cls =
      L.type === "channel" ? "c-accent" :
      L.type === "creek" ? "c-creek" :
      L.type === "ice" ? "c-ice" :
      L.type === "uptrend" ? "c-up" : "c-down";
    const name = L.type === "channel" ? "平行通道" : L.label;
    parts.push(
      `<span class="lg ${cls}"><b>${name}</b><em>${L.touches.length} 觸點 · 實體 ${L.bodyBreaks} · 引線 ${L.wickBreaks ?? 0} · ${L.windowSize}K</em></span>`
    );
  };
  add(analysis?.up);
  add(analysis?.down);
  add(analysis?.channel);
  if (!analysis?.up && !analysis?.down) {
    parts.push("<span class=\"lg\">此視窗未能形成有效四點趨勢線</span>");
  }
  return parts.join("");
}

/* ========== UI ========== */
const $ = (id) => document.getElementById(id);
if (ON_PAGES) {
  const emptyCopy = $("emptyCopy");
  if (emptyCopy) emptyCopy.textContent = "選上方日期載入已掃描的 Chartpack。";
}
const PANE_IDS = ["emptyHint", "singleView", "packView"];
let paneToken = 0;
const reduceMotion = () =>
  window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function setStatusText(text, opts = {}) {
  const el = $("statusText");
  if (!el) return;
  if (el.textContent === text) return;
  el.textContent = text;
  if (opts.animate !== false) replayAnim(el, "is-swap");
}

function setViewerTitle(title, sub) {
  const t = $("viewerTitle");
  const s = $("viewerSub");
  const block = $("titleBlock");
  const same =
    (t ? t.textContent === title : true) &&
    (s ? s.textContent === sub : true);
  if (t) t.textContent = title;
  if (s) s.textContent = sub;
  if (!same) replayAnim(block, "is-swap");
}

/** 檢視區面板切換（empty / single / pack） */
function showPane(id) {
  const next = $(id);
  if (!next) return;
  for (const pid of PANE_IDS) {
    const el = $(pid);
    if (el) el.hidden = false;
  }
  const current = PANE_IDS.map($).find(el => el?.classList.contains("is-on"));
  if (current === next) {
    next.classList.remove("is-exit");
    next.classList.add("is-on");
    return;
  }
  const token = ++paneToken;
  if (current) {
    current.classList.remove("is-on");
    current.classList.add("is-exit");
    const leaving = current;
    const ms = reduceMotion() ? 0 : 420;
    window.setTimeout(() => {
      if (token !== paneToken) return;
      leaving.classList.remove("is-exit");
    }, ms);
  }
  next.classList.remove("is-exit");
  if (!reduceMotion()) void next.offsetWidth;
  next.classList.add("is-on");
}

function setProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  $("progressBar").style.width = pct + "%";
  $("statusCount").textContent = total ? `${done} / ${total}` : "";
}

/** 近 lookback 根：突破／收回／觸碰（收回 = 實體跌破後，之後有一根實體完全回到線內） */
function recentLineEvents(row, lookback = 5) {
  const analysis = rowAnalysis(row);
  if (!row?.bars?.length || !analysis) return { touch: false, breakout: false, reclaim: false };
  const bars = row.bars;
  const n = bars.length;
  const from = Math.max(0, n - lookback);
  let touch = false;
  let breakout = false;
  let reclaim = false;
  const lines = [analysis.up, analysis.down, analysis.channel].filter(Boolean);
  for (const L of lines) {
    if (!L.line) continue;
    const resistance = L.kind === "resistance";
    let bodyBrokeAt = -1;
    for (let i = from; i < n; i++) {
      const y = yAt(L.line, i);
      const bar = bars[i];
      const bodyBrk = bodyFullCross(bar, y, resistance);
      const wickBrk = wickOnlyCross(bar, y, resistance);
      if (bodyBrk || wickBrk) breakout = true;
      if (bodyBrk && bodyBrokeAt < 0) bodyBrokeAt = i;
      else if (!bodyBrk && !wickBrk && isTouchBar(bar, y, resistance)) touch = true;
      if (bodyBrokeAt >= 0 && i > bodyBrokeAt && bodyFullyHeld(bar, y, resistance)) reclaim = true;
    }
  }
  if (reclaim || breakout) touch = false;
  return { touch, breakout, reclaim };
}

function anyFilterOn() {
  return !!(state.filters.breakout || state.filters.reclaim || state.filters.touch);
}

function matchesFilters(row) {
  if (!anyFilterOn()) return true;
  if (row.error || !row.bars) return false;
  const ev = recentLineEvents(row);
  const want = [];
  if (state.filters.breakout) want.push(ev.breakout);
  if (state.filters.reclaim) want.push(ev.reclaim);
  if (state.filters.touch) want.push(ev.touch);
  return want.some(Boolean);
}

function filteredResults() {
  return state.results.filter(matchesFilters);
}

function syncFilterChips(opts = {}) {
  const map = [
    ["filterBreakout", "breakout"],
    ["filterReclaim", "reclaim"],
    ["filterTouch", "touch"]
  ];
  for (const [id, key] of map) {
    const el = $(id);
    if (!el) continue;
    const on = !!state.filters[key];
    el.classList.toggle("active", on);
    el.setAttribute("aria-pressed", on ? "true" : "false");
    if (opts.popKey === key) replayAnim(el, "is-pop");
  }
  const skipEl = $("filterIgnoreLast10");
  if (skipEl) {
    skipEl.classList.toggle("active", !!state.ignoreLast10);
    skipEl.setAttribute("aria-pressed", state.ignoreLast10 ? "true" : "false");
    if (opts.popKey === "ignoreLast10") replayAnim(skipEl, "is-pop");
  }
  const ok = state.results.filter(r => r.bars).length;
  const n = filteredResults().filter(r => r.bars).length;
  const meta = $("filterMeta");
  if (meta) {
    const tags = [];
    if (state.filters.breakout) tags.push("突破");
    if (state.filters.reclaim) tags.push("收回");
    if (state.filters.touch) tags.push("觸碰");
    const skip = state.ignoreLast10 ? "略過最新 10 根 · " : "";
    meta.innerHTML = tags.length
      ? `${skip}篩選 <strong>${tags.join(" + ")}</strong> · <strong>${n}</strong> / ${ok} 檔`
      : `${skip}顯示全部 · <strong>${ok}</strong> 檔`;
    replayAnim(meta, "is-swap");
  }
}

/** 清單 + Chartpack 同步套用篩選 */
function applyFilters(opts = {}) {
  syncFilterChips(opts);
  renderList({ animate: true });
  if (state.view === "pack" && state.results.some(r => r.bars)) {
    renderPack();
  } else if (state.view === "single" && state.selected) {
    const row = filteredResults().find(r => r.symbol === state.selected)
      || filteredResults().find(r => r.bars);
    if (row) {
      state.selected = row.symbol;
      showSingle(row);
      renderList({ animate: true });
    }
  }
}

function renderList(opts = {}) {
  const box = $("resultList");
  box.innerHTML = "";
  if (opts.animate) replayAnim(box, "is-swap");
  const ok = state.results.filter(r => r.bars).length;
  const filtered = filteredResults();
  // 更新篩選列計數（避免與 applyFilters 循環：此處只刷新 meta 文字）
  const meta = $("filterMeta");
  if (meta) {
    const tags = [];
    if (state.filters.breakout) tags.push("突破");
    if (state.filters.reclaim) tags.push("收回");
    if (state.filters.touch) tags.push("觸碰");
    const n = filtered.filter(r => r.bars).length;
    meta.innerHTML = tags.length
      ? `篩選 <strong>${tags.join(" + ")}</strong> · <strong>${n}</strong> / ${ok} 檔`
      : `顯示全部 · <strong>${ok}</strong> 檔`;
  }
  const listCount = $("listCount");
  if (listCount) {
    const active = anyFilterOn();
    const next = active
      ? `${filtered.filter(r => r.bars).length} / ${ok} 檔`
      : `${ok} / ${state.results.length} 檔`;
    if (listCount.textContent !== next) {
      listCount.textContent = next;
      replayAnim(listCount, "is-swap");
    }
  }
  filtered.forEach((r, idx) => {
    const ev = (!r.error && r.bars) ? recentLineEvents(r) : { touch: false, breakout: false };
    const el = document.createElement("div");
    el.className = "list-item"
      + (state.selected === r.symbol ? " active" : "")
      + (r.error ? " err" : "");
    const symEl = document.createElement("span");
    symEl.className = "sym";
    symEl.textContent = r.symbol;
    el.appendChild(symEl);

    const tagBox = document.createElement("span");
    tagBox.className = "tags";
    const hints = [];
    if (r.error) {
      const t = document.createElement("span");
      t.className = "tag is-err";
      t.textContent = "無資料";
      tagBox.appendChild(t);
    } else {
      if (ev.reclaim) {
        hints.push("收回");
        const t = document.createElement("span");
        t.className = "tag is-reclaim";
        t.textContent = "收回";
        tagBox.appendChild(t);
      } else if (ev.breakout) {
        hints.push("突破");
        const t = document.createElement("span");
        t.className = "tag is-break";
        t.textContent = "突破";
        tagBox.appendChild(t);
      } else if (ev.touch) {
        hints.push("觸碰");
        const t = document.createElement("span");
        t.className = "tag is-touch";
        t.textContent = "觸碰";
        tagBox.appendChild(t);
      }
    }
    el.appendChild(tagBox);
    el.tabIndex = 0;
    el.title = r.error || (hints.length ? `${r.symbol} · ${hints.join(" · ")}` : r.symbol);
    el.setAttribute("role", "button");
    el.style.animationDelay = `${Math.min(idx, 40) * 14}ms`;
    el.onclick = () => {
      state.selected = r.symbol;
      renderList();
      showSingle(r);
      setView("single");
    };
    el.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        el.click();
      }
    };
    box.appendChild(el);
  });
  const activeEl = box.querySelector(".list-item.active");
  if (activeEl) {
    const inline = window.matchMedia("(max-width: 980px)").matches ? "center" : "nearest";
    activeEl.scrollIntoView({ block: "nearest", inline, behavior: "smooth" });
  }
}

function rowAnalysis(row) {
  if (!row?.bars) return row?.analysis || null;
  if (!state.ignoreLast10) return row.analysis;
  if (!row._skipAnalysis) {
    row._skipAnalysis = analyzeSymbol(row.bars, "auto", CFG.lineIgnoreLastBars);
  }
  return row._skipAnalysis;
}

function analyzeRow(symbol, fullBars, dateStr) {
  const bars = barsAsOf(fullBars, dateStr);
  if (bars.length < 50) throw new Error("該日期前資料不足");
  const analysis = analyzeSymbol(bars, "auto");
  if (analysis.up) analysis.up.windowSize = analysis.up.windowSize || analysis.window;
  if (analysis.down) analysis.down.windowSize = analysis.down.windowSize || analysis.window;
  return { symbol, bars, analysis };
}

const CHART_ZOOM_MIN = 20;

function defaultChartView(bars) {
  const n = bars?.length || 0;
  const rightPad = CFG.chartRightPadBars | 0;
  const win = Math.min(n, CFG.chartWindow || 600) + rightPad;
  return { win, end: n + rightPad };
}

function clampChartView(bars, view) {
  const n = bars.length;
  const rightPad = CFG.chartRightPadBars | 0;
  const maxWin = n + rightPad;
  const win = Math.max(Math.min(CHART_ZOOM_MIN, maxWin), Math.min(maxWin, Math.round(view.win)));
  const end = Math.max(win, Math.min(n + win - 1, Math.round(view.end)));
  return { win, end };
}

function applyChartView(bars, next) {
  state.chartView = clampChartView(bars, next);
  return state.chartView;
}

function redrawMainChart(row) {
  const r = row || state.results.find(x => x.symbol === state.selected);
  if (!r?.bars || r.error) return;
  const v = applyChartView(r.bars, state.chartView || defaultChartView(r.bars));
  drawChart($("mainCanvas"), r.bars, rowAnalysis(r), r.symbol, {
    date: state.packDate,
    window: v.win,
    end: v.end,
    yRange: state.chartY
  });
}

function showSingle(r) {
  state.view = "single";
  showPane("singleView");
  const btnS = $("btnSingle");
  const btnP = $("btnPack");
  if (btnS && !btnS.classList.contains("active")) replayAnim(btnS, "is-pop");
  if (btnP && btnP.classList.contains("active")) replayAnim(btnP, "is-pop");
  btnS?.classList.toggle("active", true);
  btnP?.classList.toggle("active", false);
  setViewerTitle(
    r.symbol || "單圖",
    r.error
      ? String(r.error)
      : ((state.packDate ? `日線 · ${state.packDate}` : "日線單圖") + " · 滾輪縮放 · 拖曳平移 · 雙擊還原")
  );
  const wrap = $("mainCanvas")?.closest(".chart-wrap");
  if (r.error || !r.bars) {
    $("mainLegend").textContent = r.error || "無資料";
    replayAnim(wrap, "is-swap");
    return;
  }
  const analysis = rowAnalysis(r);
  if (state.chartSymbol !== r.symbol) {
    state.chartSymbol = r.symbol;
    state.chartView = defaultChartView(r.bars);
    state.chartY = null;
  }
  redrawMainChart(r);
  $("mainLegend").innerHTML = legendHtml(analysis);
  replayAnim(wrap, "is-swap");
}

function renderPack() {
  const box = $("packView");
  box.innerHTML = "";
  let i = 0;
  const rows = filteredResults().filter(r => r.bars);
  for (const r of rows) {
    const card = document.createElement("div");
    card.className = "pack-card";
    card.style.animationDelay = `${Math.min(i, 24) * 28}ms`;
    i++;
    const canvas = document.createElement("canvas");
    canvas.width = 900;
    canvas.height = 486;
    const head = document.createElement("header");
    const ev = recentLineEvents(r);
    const symEl = document.createElement("span");
    symEl.className = "sym";
    symEl.textContent = r.symbol;
    const dateEl = document.createElement("span");
    dateEl.className = "pack-date";
    dateEl.textContent = state.packDate || "";
    const headLeft = document.createElement("span");
    headLeft.style.display = "flex";
    headLeft.style.alignItems = "baseline";
    headLeft.style.gap = "8px";
    headLeft.appendChild(symEl);
    headLeft.appendChild(dateEl);
    const tagBox = document.createElement("span");
    tagBox.className = "tags";
    if (ev.reclaim) {
      const t = document.createElement("span");
      t.className = "tag is-reclaim";
      t.textContent = "收回";
      tagBox.appendChild(t);
    } else if (ev.breakout) {
      const t = document.createElement("span");
      t.className = "tag is-break";
      t.textContent = "突破";
      tagBox.appendChild(t);
    } else if (ev.touch) {
      const t = document.createElement("span");
      t.className = "tag is-touch";
      t.textContent = "觸碰";
      tagBox.appendChild(t);
    }
    head.appendChild(headLeft);
    head.appendChild(tagBox);
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = legendHtml(rowAnalysis(r));
    card.appendChild(head);
    card.appendChild(canvas);
    card.appendChild(info);
    card.tabIndex = 0;
    card.onclick = () => {
      state.selected = r.symbol;
      renderList();
      showSingle(r);
      setView("single");
    };
    card.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        card.click();
      }
    };
    box.appendChild(card);
    drawChart(canvas, r.bars, rowAnalysis(r), r.symbol, { date: state.packDate, compact: true });
  }
  if (!box.children.length) {
    const active = anyFilterOn();
    box.innerHTML = active
      ? `<div class="empty"><div class="empty-ico"></div><h3>沒有符合篩選的圖表</h3><p>試試「突破」「收回」或「觸碰」，或清除篩選。</p></div>`
      : `<div class="empty"><div class="empty-ico"></div><h3>尚無可用圖表</h3><p>掃描完成後會顯示在這裡。</p></div>`;
  }
}

function setView(v) {
  if (v === "empty") {
    state.view = "single";
    showPane("emptyHint");
    $("btnSingle")?.classList.remove("active");
    $("btnPack")?.classList.remove("active");
    setViewerTitle("圖表區", "選左側代號檢視單圖，或切換 Chartpack");
    return;
  }
  state.view = v;
  const has = state.results.some(r => r.bars);
  const btnS = $("btnSingle");
  const btnP = $("btnPack");
  const wantSingle = v === "single" && has;
  const wantPack = v === "pack" && has;
  if (btnS && btnS.classList.contains("active") !== wantSingle) replayAnim(btnS, "is-pop");
  if (btnP && btnP.classList.contains("active") !== wantPack) replayAnim(btnP, "is-pop");
  btnS?.classList.toggle("active", wantSingle);
  btnP?.classList.toggle("active", wantPack);

  if (!has) {
    showPane("emptyHint");
    setViewerTitle("圖表區", "選左側代號檢視單圖，或切換 Chartpack");
    return;
  }
  if (v === "pack") {
    showPane("packView");
    const n = filteredResults().filter(r => r.bars).length;
    setViewerTitle("Chartpack", `${state.packDate || ""} · ${n} 檔`);
    renderPack();
    return;
  }
  showPane("singleView");
  setViewerTitle(
    state.selected || "單圖",
    state.packDate ? `日線 · ${state.packDate}` : "日線單圖"
  );
}

function updatePackButton() {
  const has = state.results.some(r => r.bars);
  $("btnPack").disabled = !has;
  $("btnSingle").disabled = !has;
  $("btnSave").disabled = !has;
}

function buildPackPayload(dateStr) {
  return {
    date: dateStr,
    index: state.index,
    indexLabel: currentIndexConfig().label,
    savedAt: new Date().toISOString(),
    count: state.results.filter(r => r.bars).length,
    results: state.results.map(r => {
      if (r.error || !r.bars) {
        return { symbol: r.symbol, error: r.error || "no data" };
      }
      return {
        symbol: r.symbol,
        bars: r.bars,
        analysis: {
          window: r.analysis.window,
          up: r.analysis.up || null,
          down: r.analysis.down || null,
          channel: r.analysis.channel || null
        }
      };
    })
  };
}

async function refreshSavedPacks(selectDate) {
  const sel = $("savedPacks");
  try {
    let dates = [];
    if (ON_PAGES) {
      const res = await fetch(packAsset("manifest.json"), { cache: "no-store" });
      const json = await res.json();
      const packs = (json.packs || []).filter(p => !state.index || p.index === state.index);
      dates = [...new Set(packs.map(p => p.date))];
    } else {
      const res = await fetch(`${LOCAL_BASE}/api/packs`);
      const json = await res.json();
      dates = json.dates || [];
    }
    const keep = selectDate || sel.value || state.packDate;
    sel.innerHTML = "";
    if (!dates.length) {
      sel.innerHTML = `<option value="">— 無 —</option>`;
      $("btnOpen").disabled = true;
      return dates;
    }
    for (const d of dates) {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    }
    if (keep && dates.includes(keep)) sel.value = keep;
    $("btnOpen").disabled = !sel.value;
    return dates;
  } catch (e) {
    sel.innerHTML = `<option value="">— 無法讀取 —</option>`;
    $("btnOpen").disabled = true;
    return [];
  }
}

async function savePack(dateStr) {
  if (ON_PAGES) {
    setStatusText("GitHub Pages 為唯讀；結果由 Actions 掃描寫入倉庫");
    return false;
  }
  const d = dateStr || state.packDate || $("packDate").value || todayISO();
  if (!state.results.some(r => r.bars)) {
    setStatusText("無可保存的 Chartpack");
    return false;
  }
  setStatusText(`保存 ${d} Chartpack…`);
  try {
    const payload = buildPackPayload(d);
    const res = await fetch(`${LOCAL_BASE}/api/packs/${encodeURIComponent(d)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || ("HTTP " + res.status));
    await refreshSavedPacks(d);
    setStatusText(`已保存 ${d} · ${payload.count} 檔`);
    return true;
  } catch (e) {
    setStatusText(`保存失敗：${e.message || e}`);
    return false;
  }
}

async function openPack(dateStr) {
  const d = dateStr || $("savedPacks").value || $("packDate").value;
  if (!d) {
    setStatusText("請先選擇已存日期");
    return false;
  }
  setStatusText(`開啟 ${d} Chartpack…`);
  try {
    let res;
    if (ON_PAGES) {
      const files = [`${state.index}-${d}.json`, `${d}.json`];
      res = null;
      for (const f of files) {
        const tryRes = await fetch(packAsset(f), { cache: "no-store" });
        if (tryRes.ok) { res = tryRes; break; }
      }
      if (!res) throw new Error("找不到該日 Chartpack");
    } else {
      res = await fetch(`${LOCAL_BASE}/api/packs/${encodeURIComponent(d)}`);
    }
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error || ("HTTP " + res.status));
    state.packDate = json.date || d;
    $("packDate").value = state.packDate;
    if (json.index && INDEXES[json.index]) {
      state.index = json.index;
      syncIndexUi();
    }
    state.results = (json.results || []).map(r => {
      const bars = r.bars || null;
      const analysis = bars && r.analysis ? rebaseAnalysis(r.analysis, bars.length) : (r.analysis || null);
      return {
        symbol: r.symbol,
        error: r.error || null,
        bars,
        analysis
      };
    });
    state.selected = state.results.find(r => r.bars)?.symbol || null;
    state.cache = {};
    renderList();
    updatePackButton();
    await refreshSavedPacks(state.packDate);
    const ok = state.results.filter(r => r.bars).length;
    if (ok) {
      setView("pack");
      setStatusText(`已開啟 ${state.packDate} · ${ok} 檔`);
    } else {
      setView("empty");
      setStatusText(`${state.packDate} — 檔案無可用圖表`);
    }
    return true;
  } catch (e) {
    setStatusText(`開啟失敗：${e.message || e}`);
    return false;
  }
}

/** 用快取資料依日期重算（無需重抓）；若無快取則嘗試開啟已存 */
async function rebuildForDate(dateStr) {
  state.packDate = dateStr;
  const syms = Object.keys(state.cache);
  if (!syms.length) {
    const dates = await refreshSavedPacks();
    if (dates.includes(dateStr)) {
      await openPack(dateStr);
    } else {
      setStatusText(ON_PAGES
        ? `沒有 ${dateStr} 的 Chartpack`
        : `已選 ${dateStr} — 點「掃描」或從「已存」開啟`);
    }
    return;
  }
  state.results = [];
  state.selected = null;
  setStatusText(`重算 ${dateStr} Chartpack…`);
  for (const sym of syms) {
    try {
      const row = analyzeRow(sym, state.cache[sym], dateStr);
      state.results.push(row);
    } catch (e) {
      state.results.push({ symbol: sym, error: String(e.message || e) });
    }
  }
  renderList({ animate: true });
  updatePackButton();
  if (state.results.some(r => r.bars)) {
    setView("pack");
    setStatusText(`${dateStr} Chartpack · ${state.results.filter(r => r.bars).length} 檔（未保存）`);
  } else {
    setView("empty");
    setStatusText(`${dateStr} — 無可用資料`);
  }
}

async function runScan() {
  state.stop = false;
  state.results = [];
  state.selected = null;
  state.cache = {};
  document.body.classList.add("is-scanning");
  $("btnScan").disabled = true;
  $("btnScan").classList.add("is-busy");
  $("btnStop").disabled = false;
  $("btnPack").disabled = true;
  $("btnSingle").disabled = true;
  if ($("indexSelect")) $("indexSelect").disabled = true;
  $("resultList").innerHTML = "";
  $("packView").innerHTML = "";
  showPane("emptyHint");
  const idxLabel = currentIndexConfig().label;
  setViewerTitle("掃描中", `分析 ${idxLabel} 日線…`);
  if ($("listCount")) {
    $("listCount").textContent = "掃描中…";
    replayAnim($("listCount"), "is-swap");
  }

  const dateStr = $("packDate").value || todayISO();
  state.packDate = dateStr;
  $("packDate").value = dateStr;

  setStatusText(`取得 ${idxLabel} 成分股…`);
  try {
    state.symbols = await fetchIndexSymbols();
  } catch (_) {
    state.symbols = [...currentIndexConfig().fallback];
  }

  const total = state.symbols.length;
  let done = 0;
  setProgress(0, total);

  for (const sym of state.symbols) {
    if (state.stop) break;
    setStatusText(`分析 ${sym} · ${dateStr}…`, { animate: false });
    try {
      const full = await fetchDailyBars(sym);
      state.cache[sym] = full;
      const row = analyzeRow(sym, full, dateStr);
      state.results.push(row);
      // 掃描中先顯示單圖，完成後切 Chartpack
      if (!state.selected) {
        state.selected = sym;
        showSingle(row);
        setView("single");
      }
    } catch (e) {
      state.results.push({ symbol: sym, error: String(e.message || e) });
    }
    done++;
    setProgress(done, total);
    renderList();
    await new Promise(r => setTimeout(r, 120));
  }

  document.body.classList.remove("is-scanning");
  $("btnScan").disabled = false;
  $("btnScan").classList.remove("is-busy");
  $("btnStop").disabled = true;
  if ($("indexSelect")) $("indexSelect").disabled = false;
  updatePackButton();
  const ok = state.results.filter(r => r.bars).length;
  if (ok) {
    setView("pack");
    const saved = await savePack(dateStr);
    if (!saved) {
      setStatusText(state.stop
        ? `已停止 — ${dateStr} · ${done}/${total}（未保存）`
        : `完成 — ${dateStr} · ${ok} 檔（保存失敗，可點「保存」重試）`);
    }
  } else {
    setView("empty");
    setStatusText(state.stop
      ? `已停止 — ${dateStr} · ${done}/${total}`
      : `完成 — ${dateStr} · 無可用圖表`);
  }
}

  applyFilters({ popKey: "touch" });
};
syncFilterChips();
$("filterIgnoreLast10").onclick = () => {
  state.ignoreLast10 = !state.ignoreLast10;
  applyFilters({ popKey: "ignoreLast10" });
};

/** 視窗尺寸變動時重繪（canvas 依實際寬度計算，避免字被縮小） */
let __resizeTimer = 0;
function onViewportResize() {
  clearTimeout(__resizeTimer);
  __resizeTimer = window.setTimeout(() => {
    if (state.view === "pack") {
      renderPack();
      return;
    }
    if (state.view === "single") redrawMainChart();
  }, 160);
}
window.addEventListener("resize", onViewportResize);
window.visualViewport?.addEventListener("resize", onViewportResize);

(function bindMainChartNav() {
  const canvas = $("mainCanvas");
  if (!canvas) return;
  const pts = new Map();
  let pan = null;
  let pinch = null;

  function row() {
    return state.results.find(r => r.symbol === state.selected);
  }

  function zoomAt(clientX, factor) {
    const r = row();
    if (!r?.bars) return;
    const meta = canvas._chartMeta;
    const v = state.chartView || defaultChartView(r.bars);
    const rect = canvas.getBoundingClientRect();
    let frac = 0.5;
    if (meta && meta.pw > 0) {
      frac = (clientX - rect.left - meta.left) / meta.pw;
      frac = Math.max(0, Math.min(1, frac));
    }
    const anchor = (v.end - v.win) + frac * v.win;
    const win = v.win * factor;
    const start = anchor - frac * win;
    state.chartY = null;
    applyChartView(r.bars, { win, end: start + win });
    redrawMainChart(r);
  }

  canvas.addEventListener("wheel", (e) => {
    if (state.view !== "single") return;
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.14 : 1 / 1.14;
    zoomAt(e.clientX, factor);
  }, { passive: false });

  canvas.addEventListener("pointerdown", (e) => {
    if (state.view !== "single" || e.button !== 0) return;
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = row();
    const v = state.chartView || (r?.bars ? defaultChartView(r.bars) : null);
    const meta = canvas._chartMeta;
    const wrap = canvas.closest(".chart-wrap");
    if (pts.size === 1 && v) {
      pan = {
        x: e.clientX,
        y: e.clientY,
        x0: e.clientX,
        y0: e.clientY,
        end: v.end,
        lo: meta?.lo,
        hi: meta?.hi,
        armed: false
      };
      pinch = null;
      wrap?.classList.add("is-panning");
    } else if (pts.size === 2 && v) {
      const [a, b] = [...pts.values()];
      pinch = {
        dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        win: v.win,
        end: v.end,
        midX: (a.x + b.x) / 2
      };
      pan = null;
    }
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = row();
    if (!r?.bars) return;
    const meta = canvas._chartMeta;
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const win = pinch.win * (pinch.dist / dist);
      const meta2 = canvas._chartMeta;
      let frac = 0.5;
      if (meta2 && meta2.pw > 0) {
        const rect = canvas.getBoundingClientRect();
        frac = (pinch.midX - rect.left - meta2.left) / meta2.pw;
        frac = Math.max(0, Math.min(1, frac));
      }
      const anchor = (pinch.end - pinch.win) + frac * pinch.win;
      state.chartY = null;
      applyChartView(r.bars, { win, end: anchor - frac * win + win });
      redrawMainChart(r);
      return;
    }
    if (!pan || !meta || meta.n < 1) return;
    if (!pan.armed) {
      if (Math.hypot(e.clientX - pan.x0, e.clientY - pan.y0) < 5) return;
      pan.armed = true;
    }
    const v = state.chartView || defaultChartView(r.bars);
    const barW = meta.pw / meta.n;
    if (barW > 0) {
      applyChartView(r.bars, { win: v.win, end: pan.end + (pan.x - e.clientX) / barW });
    }
    if (meta.ph > 0 && pan.hi > pan.lo) {
      const dP = ((e.clientY - pan.y) / meta.ph) * (pan.hi - pan.lo);
      state.chartY = { lo: pan.lo + dP, hi: pan.hi + dP };
    }
    redrawMainChart(r);
  });

  function endPtr(e) {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) {
      pan = null;
      canvas.closest(".chart-wrap")?.classList.remove("is-panning");
    } else if (pts.size === 1) {
      const r = row();
      const v = state.chartView;
      const p = [...pts.values()][0];
      const meta = canvas._chartMeta;
      if (r?.bars && v) {
        pan = {
          x: p.x,
          y: p.y,
          x0: p.x,
          y0: p.y,
          end: v.end,
          lo: meta?.lo,
          hi: meta?.hi,
          armed: true
        };
      }
    }
  }
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);

  canvas.addEventListener("dblclick", (e) => {
    if (state.view !== "single") return;
    e.preventDefault();
    const r = row();
    if (!r?.bars) return;
    state.chartView = defaultChartView(r.bars);
    state.chartY = null;
    redrawMainChart(r);
  });
})();

refreshSavedPacks().then((dates) => {
  if (ON_PAGES && dates[0]) openPack(dates[0]);
});
</script>
</body>
</html>
