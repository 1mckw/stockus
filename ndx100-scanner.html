<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NDX100 日線掃描器 · 趨勢線 / Creek / Ice</title>
<meta name="description" content="NDX100 / DJI30 / CRYPTO30 日線四點成線掃描器：向上／向下趨勢線、Creek、Ice，附逐日 Chartpack。" />
<meta name="theme-color" content="#161618" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NDX 掃描" />
<meta name="format-detection" content="telephone=no" />
<script>if (/\.github\.io$/i.test(location.hostname)) document.documentElement.classList.add("is-pages");</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     NDX100 Scanner — data terminal
     平面深色、單一藍色強調（只做 1px 選取線）、數字等寬
     ============================================================ */
  :root {
    --ground: #161618;
    --surface: #101114;
    --surface-2: #17181c;
    --raised: #1e2025;
    --line: #282a30;
    --line-strong: #3c3f47;
    --rule: #202227;
    --text: #f4f5f7;
    --muted: #a2a6ae;
    --dim: #7d828c;
    --accent: #6ba6e8;
    --accent-line: #4a8ad6;
    --pos: #4faf8d;
    --neg: #e5647c;
    --warn: #d9a441;
    --ice: #8ab4d9;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Public Sans", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    --r: 10px;
    --r-sm: 6px;
    --dur: 0.18s;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    background: var(--ground);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  ::selection { background: rgba(74, 138, 214, 0.35); color: #fff; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: #2e3138;
    border: 3px solid var(--surface);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: #3c4048; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .app {
    height: 100dvh;
    min-width: 0;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--ground);
    flex-shrink: 0;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-start;
    min-width: 0;
    width: 100%;
  }
  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 6px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-2);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 1px 6px 2px;
    min-width: 0;
  }
  .field > span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    line-height: 1.4;
  }
  .field input[type="date"],
  .field select {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 0;
    outline: none;
    padding: 1px 0;
    color-scheme: dark;
    cursor: pointer;
  }
  .field input[type="date"] { min-width: 126px; }
  .field select { min-width: 112px; max-width: 150px; }
  .field-date-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  .pack-meta {
    display: none;
    font-family: var(--mono);
    font-size: 12.5px;
    font-style: normal;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(42vw, 280px);
  }

  button {
    appearance: none;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition:
      background var(--dur) ease,
      border-color var(--dur) ease,
      color var(--dur) ease,
      opacity var(--dur) ease;
  }
  button:hover:not(:disabled) { background: var(--raised); border-color: #4b4f58; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.34; cursor: not-allowed; }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  button.primary {
    border-color: var(--accent-line);
    color: var(--accent);
    background: rgba(74, 138, 214, 0.1);
  }
  button.primary:hover:not(:disabled) {
    background: rgba(74, 138, 214, 0.18);
    border-color: var(--accent);
  }
  button.ghost-danger:hover:not(:disabled) {
    color: var(--neg);
    border-color: var(--neg);
    background: transparent;
  }
  button.is-busy { pointer-events: none; opacity: 0.6; }

  /* ---------- Status strip ---------- */
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 20px;
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  body.is-scanning .status-dot {
    background: var(--accent);
    animation: pulseDot 1.2s ease-in-out infinite;
  }
  #statusText {
    flex: 0 1 auto;
    min-width: 190px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress {
    flex: 1 1 auto;
    min-width: 120px;
    height: 3px;
    background: var(--rule);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > i {
    display: block;
    width: 0%;
    height: 100%;
    background: var(--accent-line);
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  #statusCount {
    font-family: var(--mono);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    min-width: 54px;
    text-align: right;
  }

  /* ---------- Main ---------- */
  main {
    display: grid;
    grid-template-columns: 284px minmax(0, 1fr);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    align-items: stretch;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  .sidebar-head {
    flex-shrink: 0;
    padding: 14px 16px 11px;
    border-bottom: 1px solid var(--rule);
  }
  .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .sidebar-head h2 {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #listCount {
    font-family: var(--mono);
    font-style: normal;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .filter-bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px 8px;
    margin-top: 13px;
  }
  .filter-bar-label {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.06em;
  }
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 4px;
    width: 100%;
    min-width: 0;
  }
  .filter-chip {
    position: relative;
    height: 26px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .filter-chip:hover:not(:disabled) {
    background: var(--raised);
    border-color: transparent;
    color: var(--text);
  }
  .filter-chip.active { color: var(--text); }
  .filter-chip.active::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 2px;
    height: 1px;
    background: var(--accent-line);
  }
  .filter-meta {
    display: block;
    margin-top: 9px;
    font-size: 11.5px;
    color: var(--dim);
    line-height: 1.45;
  }
  .filter-meta strong {
    color: var(--text);
    font-weight: 500;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    padding: 7px 16px;
    border-bottom: 1px solid var(--rule);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #resultList {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
  }
  #resultList:empty::before {
    content: "尚無結果";
    display: block;
    padding: 18px 16px;
    font-size: 12px;
    color: var(--dim);
  }
  .list-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 42px;
    padding: 0 16px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    outline: none;
    transition: background var(--dur) ease, color var(--dur) ease;
  }
  .list-item:hover,
  .list-item:focus-visible { background: var(--surface-2); color: var(--text); }
  .list-item.active { background: var(--surface-2); color: var(--text); }
  .list-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--accent-line);
  }
  .list-item.err { opacity: 0.55; }
  .list-item .sym { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .list-item .tags {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--dim);
  }
  .tag { white-space: nowrap; }
  .tag.is-break { color: var(--warn); }
  .tag.is-reclaim { color: var(--pos); }
  .tag.is-touch { color: var(--ice); }
  .tag.is-err { color: var(--dim); }
  .pack-card header .tag,
  .pack-past .tag {
    cursor: pointer;
    border-radius: 4px;
    padding: 0 4px;
  }
  .pack-card header .tag.is-filter,
  .pack-past .tag.is-filter {
    background: color-mix(in srgb, currentColor 18%, transparent);
  }

  /* ---------- Viewer ---------- */
  .viewer {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: 16px 22px 26px;
    background: var(--ground);
  }
  .viewer-toolbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
    position: relative;
    z-index: 20;
    padding-bottom: 11px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }
  .title-block { min-width: 0; }
  .title-block h2 {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--text);
  }
  .skip-chips {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex: 1 1 auto;
    flex-wrap: wrap;
    gap: 8px 12px;
    min-width: 0;
    padding-bottom: 2px;
  }
  .skip-chips .filter-chip {
    height: 28px;
    font-size: 13px;
    flex: 0 0 auto;
  }
  .skip-chips .filter-chip.active {
    border-color: var(--line-strong);
    background: var(--raised);
    border-radius: 999px;
  }
  .skip-chips .filter-chip.active::after { display: none; }
  .skip-cal-wrap { position: relative; flex: 0 0 auto; z-index: 21; }
  .skip-cal {
    display: none;
    position: fixed;
    z-index: 200;
    width: 232px;
    padding: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }
  .skip-cal-wrap.is-open .skip-cal { display: block; }
  .skip-cal-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 0 6px 10px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .skip-cal-head em {
    font-style: normal;
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }
  .skip-cal-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
  }
  .skip-cal-grid button {
    height: 36px;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .skip-cal-grid button:hover:not(:disabled) {
    background: var(--raised);
    border-color: transparent;
  }
  .skip-cal-grid button.active {
    background: var(--accent-line);
    color: #fff;
  }
  .skip-cal-opt {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 32px;
    margin-top: 10px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .skip-cal-opt:hover:not(:disabled) {
    color: var(--text);
    background: var(--raised);
    border-color: transparent;
  }
  .skip-cal-opt.active {
    color: var(--text);
    background: rgba(74, 138, 214, 0.28);
  }
  .skip-cal-opt.active:hover:not(:disabled) {
    color: var(--text);
    background: rgba(74, 138, 214, 0.38);
  }
  .seg { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
  .seg button {
    position: relative;
    height: 28px;
    padding: 0 1px;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
  }
  .seg button:hover:not(:disabled) { background: transparent; color: var(--text); }
  .seg button.active { color: var(--text); background: transparent; }
  .seg button.active::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: -12px;
    height: 1px;
    background: var(--accent-line);
  }

  .viewer-stage {
    position: relative;
    min-height: 0;
    flex: 1 1 auto;
    overflow: auto;
  }
  .view-pane {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  .view-pane.is-on {
    position: relative;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: none;
  }
  .view-pane.is-exit {
    opacity: 0;
    transform: translateY(-4px);
    visibility: hidden;
  }

  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px 10px;
    overflow: hidden;
  }
  .chart-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .chart-wrap.is-panning,
  .chart-wrap.is-panning canvas { cursor: grabbing; }
  #singleView.is-on {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 176px;
    gap: 12px;
    align-items: start;
  }
  .signal-cases {
    min-width: 0;
    padding: 10px 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
  }
  .signal-cases h3 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }
  .signal-cases .case-empty,
  .pack-past .case-empty {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }
  .signal-case {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 8px;
    margin: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }
  .signal-case:hover:not(:disabled) {
    background: var(--raised);
    border-color: transparent;
  }
  .signal-case.is-on {
    background: var(--raised);
    box-shadow: inset 2px 0 0 var(--accent-line);
  }
  .signal-case.is-on .skip { color: var(--text); }
  .signal-case .skip {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .signal-case .tags {
    display: flex;
    gap: 6px;
    flex: 0 0 auto;
    font-size: 11px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 22px;
    margin-top: 8px;
    padding: 11px 4px 2px;
    border-top: 1px solid var(--rule);
    font-size: 12px;
    color: var(--muted);
  }
  .lg { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
  .lg::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dot, var(--dim));
    flex-shrink: 0;
  }
  .lg b { font-weight: 600; color: var(--text); white-space: nowrap; }
  .lg.is-why { align-items: flex-start; }
  .lg.is-why b { color: var(--muted); font-weight: 500; }
  .lg.is-why em { white-space: normal; color: var(--dim); }
  .lg em {
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    white-space: nowrap;
  }
  .c-up { --dot: var(--pos); }
  .c-down { --dot: var(--neg); }
  .c-creek { --dot: var(--warn); }
  .c-ice { --dot: var(--ice); }

  /* ---------- Chartpack grid ---------- */
  .pack-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
    gap: 16px;
  }
  .pack-card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    overflow: hidden;
    cursor: pointer;
    outline: none;
    transition: border-color var(--dur) ease, background var(--dur) ease;
  }
  .pack-card:hover,
  .pack-card:focus-visible {
    border-color: var(--line-strong);
    background: var(--surface-2);
  }
  .pack-card header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .pack-card header .pack-date {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--dim);
    letter-spacing: 0.03em;
  }
  .pack-card header .tags {
    display: flex;
    gap: 8px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--dim);
  }

  /* ---------- Motion (subtle only) ---------- */

  @keyframes fadeSwap {

  html.is-pages .pages-hide,

  @media (prefers-reduced-motion: reduce) {

  /* ---------- Responsive ---------- */

<div class="app">
  <header class="topbar">
